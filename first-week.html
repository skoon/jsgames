<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081012">
<title>First Week</title>
<link rel="stylesheet" href="common.css">
<style>
  :root {
    --bg-top: #24362f;
    --bg-mid: #0b1415;
    --bg-bottom: #05090a;
    --stage-bg: #081012;
    --ink: #f0f7ef;
    --muted: rgba(224, 240, 232, 0.48);
    --teal: #6ee7cf;
    --blue: #85c9ff;
    --red: #ff8275;
    --line: rgba(143, 220, 205, 0.16);
    --panel: rgba(8, 19, 21, 0.94);
    --topbar-bg: linear-gradient(180deg, rgba(21, 37, 36, 0.95), rgba(7, 16, 18, 0.88));
    --stage-offset: 55px;
  }

  #ui {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 12px 9px;
    pointer-events: none;
  }
  #ui > * { pointer-events: auto; }
  .hud {
    flex: 0 0 auto;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 9px;
    border: 1px solid var(--line);
    border-radius: var(--radius-topbar);
    background: var(--topbar-bg);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045);
  }
  .brand-mark {
    width: 21px;
    height: 21px;
    border-radius: 5px;
    font-weight: 400;
  }
  .brand b {
    font-size: 12px;
    line-height: 1.05;
    letter-spacing: 0.1em;
  }
  .brand small {
    margin-top: 2px;
    font-size: var(--text-2xs);
    letter-spacing: 0.14em;
  }
  .stats { display: flex; align-items: center; gap: 13px; flex: none; }
  .stat { text-align: right; }
  .stat span {
    display: block;
    color: var(--muted);
    font-size: var(--text-2xs);
    letter-spacing: 0.14em;
  }
  .stat strong {
    display: block;
    margin-top: 1px;
    color: var(--teal);
    font-size: 15px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat:last-child strong { color: rgba(240, 247, 239, 0.52); }
  .stat strong.flash { animation: score-flash 300ms ease-out; }
  @keyframes score-flash {
    0% { color: #ffffff; text-shadow: 0 0 18px rgba(110, 231, 207, 0.9); }
    100% { color: var(--teal); text-shadow: none; }
  }

  .dayline {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 3px;
    color: var(--muted);
    font-size: var(--text-2xs);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #dayTag {
    color: var(--amber);
    font-weight: 700;
  }
  #sceneTag {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dayline .dot {
    width: 3px;
    height: 3px;
    flex: none;
    border-radius: 50%;
    background: rgba(255, 200, 107, 0.5);
  }
  #modeTag { margin-left: auto; color: rgba(224, 240, 232, 0.28); font-size: var(--text-2xs); }

  .scene-space {
    flex: 1 1 0;
    min-height: 56px;
    pointer-events: none;
  }

  .storybox {
    flex: 0 0 auto;
    max-height: 67%;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 10px 11px 8px;
    border: 1px solid rgba(143, 220, 205, 0.18);
    border-radius: 13px;
    background:
      linear-gradient(180deg, rgba(17, 34, 33, 0.97), rgba(6, 15, 17, 0.98));
    box-shadow:
      0 18px 44px -20px rgba(0, 0, 0, 0.9),
      inset 0 1px 0 rgba(255, 255, 255, 0.045);
    scrollbar-width: thin;
  }
  .speakerline {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .portrait {
    width: 27px;
    height: 27px;
    flex: none;
    display: grid;
    place-items: center;
    border: 1px solid color-mix(in srgb, var(--speaker, #6ee7cf) 48%, transparent);
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--speaker, #6ee7cf) 32%, transparent), rgba(255, 255, 255, 0.03));
    color: var(--speaker, #6ee7cf);
    font-size: var(--text-sm);
    font-weight: 700;
    box-shadow: 0 0 16px color-mix(in srgb, var(--speaker, #6ee7cf) 12%, transparent);
  }
  .speaker-meta { min-width: 0; flex: 1; }
  .speaker-meta b {
    display: block;
    color: var(--ink);
    font-size: var(--text-sm);
    line-height: 1.1;
    letter-spacing: 0.04em;
  }
  .speaker-meta small {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: var(--text-2xs);
    letter-spacing: 0.05em;
  }
  .feedback {
    flex: none;
    padding: 3px 5px;
    border: 1px solid rgba(143, 220, 205, 0.25);
    border-radius: 4px;
    background: rgba(110, 231, 207, 0.08);
    color: var(--teal);
    font-size: var(--text-2xs);
    font-weight: 700;
    letter-spacing: 0.07em;
    white-space: nowrap;
  }
  .feedback.report {
    border-color: rgba(255, 200, 107, 0.32);
    background: rgba(255, 200, 107, 0.09);
    color: #ffd88f;
  }
  .feedback.train {
    border-color: rgba(133, 201, 255, 0.32);
    background: rgba(133, 201, 255, 0.09);
    color: #b9e1ff;
  }
  .feedback.safe {
    border-color: rgba(110, 231, 207, 0.3);
    background: rgba(110, 231, 207, 0.08);
    color: #b6ffef;
  }
  .feedback.unsafe {
    border-color: rgba(255, 130, 117, 0.4);
    background: rgba(255, 130, 117, 0.1);
    color: #ffb3aa;
  }
  #storyText {
    margin: 8px 1px 0;
    color: rgba(240, 247, 239, 0.78);
    font-size: var(--text-sm);
    line-height: 1.58;
    letter-spacing: 0.005em;
    white-space: pre-line;
  }
  .outcome {
    margin: 8px 0 0;
    padding: 5px 7px;
    border-left: 2px solid rgba(110, 231, 207, 0.5);
    border-radius: 0 5px 5px 0;
    background: rgba(110, 231, 207, 0.04);
    color: rgba(224, 240, 232, 0.52);
    font-size: var(--text-2xs);
    line-height: 1.45;
  }
  .outcome.unsafe {
    border-left-color: rgba(255, 130, 117, 0.65);
    background: rgba(255, 130, 117, 0.055);
    color: rgba(255, 207, 202, 0.7);
  }
  .choices {
    display: grid;
    gap: 5px;
    margin-top: 9px;
  }
  .choice {
    width: 100%;
    display: flex;
    align-items: flex-start;
    gap: 7px;
    padding: 7px 8px;
    border: 1px solid rgba(143, 220, 205, 0.2);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.034);
    color: var(--ink);
    font: inherit;
    font-size: var(--text-xs);
    line-height: 1.4;
    letter-spacing: 0.005em;
    text-align: left;
    cursor: pointer;
    transition:
      background 110ms ease,
      border-color 110ms ease,
      transform 100ms ease;
  }
  .choice:hover {
    border-color: rgba(110, 231, 207, 0.52);
    background: rgba(110, 231, 207, 0.065);
  }
  .choice:active { transform: translateY(1px); }
  .choice:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }
  .choice.final {
    border-color: rgba(255, 200, 107, 0.28);
    background: rgba(255, 200, 107, 0.045);
  }
  .key {
    width: 16px;
    height: 16px;
    flex: none;
    display: grid;
    place-items: center;
    margin-top: 1px;
    border: 1px solid rgba(255, 200, 107, 0.35);
    border-radius: 4px;
    background: rgba(255, 200, 107, 0.08);
    color: var(--amber);
    font-size: var(--text-2xs);
    font-weight: 700;
    line-height: 1;
  }
  .choice-text { min-width: 0; }
  .controls {
    margin: 7px 1px 0;
    color: rgba(224, 240, 232, 0.28);
    font-size: var(--text-2xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .controls b { color: rgba(255, 200, 107, 0.62); font-weight: 700; }

  /* ---------- overlays ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(3, 8, 9, 0.88);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    animation: fade-in 160ms ease-out;
  }
  .overlay[hidden] { display: none; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%;
    max-width: 330px;
    max-height: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 18px 17px 15px;
    border: 1px solid rgba(143, 220, 205, 0.16);
    border-radius: 14px;
    background:
      linear-gradient(180deg, rgba(20, 38, 37, 0.99), rgba(6, 15, 17, 0.99));
    box-shadow:
      0 24px 60px -25px rgba(0, 0, 0, 0.95),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    text-align: center;
    scrollbar-width: thin;
  }
  .eyebrow {
    margin: 0 0 5px;
    color: var(--amber);
    font-size: var(--text-2xs);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .title {
    margin: 0 0 9px;
    color: var(--ink);
    font-size: clamp(26px, 7.2vw, 36px);
    line-height: 1.03;
    letter-spacing: 0.015em;
    text-shadow: 0 0 30px rgba(110, 231, 207, 0.15);
  }
  .title .accent { color: var(--teal); }
  .lead {
    margin: 0;
    color: rgba(224, 240, 232, 0.62);
    font-size: var(--text-sm);
    line-height: 1.55;
    letter-spacing: 0.005em;
  }
  .lead b { color: rgba(255, 200, 107, 0.85); font-weight: 700; }
  .rules {
    display: grid;
    gap: 4px;
    margin: 11px 0 0;
    text-align: left;
  }
  .rule {
    position: relative;
    padding-left: 13px;
    color: rgba(224, 240, 232, 0.58);
    font-size: var(--text-xs);
    line-height: 1.45;
  }
  .rule::before {
    content: "▸";
    position: absolute;
    left: 1px;
    color: var(--amber);
  }
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-top: 12px;
  }
  .metric {
    padding: 7px 3px 6px;
    border: 1px solid rgba(255, 255, 255, 0.065);
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.025);
  }
  .metric span {
    display: block;
    color: var(--muted);
    font-size: var(--text-2xs);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .metric strong {
    display: block;
    margin-top: 3px;
    color: var(--ink);
    font-size: 11px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .result {
    margin: 13px 0 0;
    padding: 9px;
    border: 1px solid rgba(110, 231, 207, 0.16);
    border-radius: 9px;
    background: rgba(110, 231, 207, 0.045);
  }
  .result span {
    display: block;
    color: var(--muted);
    font-size: var(--text-2xs);
    letter-spacing: 0.18em;
  }
  .result strong {
    display: block;
    margin-top: 1px;
    color: var(--teal);
    font-size: 34px;
    line-height: 1;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 26px rgba(110, 231, 207, 0.25);
  }
  .result small {
    display: block;
    margin-top: 5px;
    color: var(--muted);
    font-size: var(--text-2xs);
    letter-spacing: 0.12em;
  }
  .week-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-top: 8px;
  }
  .week-stat {
    padding: 6px 3px 5px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.02);
  }
  .week-stat span {
    display: block;
    color: var(--muted);
    font-size: var(--text-2xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .week-stat strong {
    display: block;
    margin-top: 2px;
    color: var(--ink);
    font-size: 12px;
  }
  .week-stat.ask strong { color: var(--teal); }
  .week-stat.report strong { color: var(--amber); }
  .week-stat.train strong { color: var(--blue); }
  .btn {
    margin-top: 14px;
    padding: 11px 24px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, #7ff0d4, #46c8a9);
    box-shadow:
      0 14px 30px -14px rgba(94, 231, 199, 0.9),
      inset 0 -2px 0 rgba(0, 0, 0, 0.16);
    color: #06211c;
    font: inherit;
    font-size: var(--text-sm);
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: filter 120ms ease, transform 100ms ease;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px) scale(0.99); }
  .btn:focus-visible { outline: 2px solid #c9fff3; outline-offset: 3px; }
  .fine {
    margin: 8px 0 0;
    color: rgba(224, 240, 232, 0.28);
    font-size: var(--text-2xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .fine:empty { display: none; }
  [hidden] { display: none !important; }

  /* ---------- compact stages ---------- */
  @container (max-height: 540px) {
    #ui { gap: 4px; padding: 7px 9px; }
    .hud { padding: 4px 7px; }
    .brand b { font-size: var(--text-sm); }
    .brand small { display: none; }
    .brand-mark { width: 18px; height: 18px; font-size: var(--text-sm); }
    .stat strong { font-size: 13px; }
    .dayline { font-size: var(--text-2xs); }
    #modeTag { display: none; }
    .scene-space { min-height: 34px; }
    .storybox { max-height: 72%; padding: 7px 8px 6px; }
    .portrait { width: 23px; height: 23px; font-size: var(--text-xs); }
    .speaker-meta b { font-size: var(--text-xs); }
    .speaker-meta small { font-size: var(--text-2xs); }
    #storyText { margin-top: 6px; font-size: var(--text-xs); line-height: 1.5; }
    .outcome { margin-top: 5px; padding: 4px 6px; font-size: var(--text-2xs); }
    .choices { gap: 4px; margin-top: 6px; }
    .choice { padding: 5px 6px; font-size: var(--text-2xs); gap: 5px; }
    .key { width: 14px; height: 14px; font-size: var(--text-2xs); }
    .controls { margin-top: 5px; font-size: var(--text-2xs); }
    .overlay { padding: 11px; }
    .panel { padding: 13px 13px 11px; }
    .title { font-size: 26px; margin-bottom: 6px; }
    .lead { font-size: var(--text-xs); }
    .rule { font-size: var(--text-2xs); }
    .metrics { margin-top: 8px; }
    .metric { padding: 5px 2px; }
    .metric strong { font-size: var(--text-sm); }
    .result { margin-top: 8px; padding: 7px; }
    .result strong { font-size: 28px; }
    .btn { margin-top: 10px; padding: 8px 16px; font-size: var(--text-xs); }
  }
  @media (prefers-reduced-motion: reduce) {
    .overlay { animation: none; }
    .stat strong.flash { animation: none; }
    .choice { transition: none; }
  }
</style>
</head>
<body>
  <h1 class="sr-only">First Week: a workplace safety branching story</h1>
  <div id="stage">
    <canvas id="game" width="480" height="640" aria-hidden="true"></canvas>
    <div id="ui">
      <header class="hud">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">▤</span>
          <span>
            <b>FIRST WEEK</b>
            <small>NORTHLIGHT MARKET</small>
          </span>
        </div>
        <div class="stats">
          <div class="stat"><span>SCORE</span><strong id="score">000</strong></div>
          <div class="stat"><span>BEST</span><strong id="best">000</strong></div>
        </div>
      </header>
      <div class="dayline">
        <span id="dayTag">DAY 01 / 05</span>
        <span class="dot" aria-hidden="true"></span>
        <span id="sceneTag">FRONT COUNTER</span>
        <span id="modeTag">NO TIMER</span>
      </div>
      <div class="scene-space" aria-hidden="true"></div>
      <section id="storybox" class="storybox" aria-live="polite">
        <div class="speakerline">
          <span id="portrait" class="portrait" aria-hidden="true">D</span>
          <div class="speaker-meta">
            <b id="speakerName">Dana Park</b>
            <small id="speakerRole">Store manager</small>
          </div>
          <span id="feedback" class="feedback" hidden></span>
        </div>
        <p id="storyText"></p>
        <p id="outcome" class="outcome" hidden></p>
        <div id="choices" class="choices"></div>
        <p id="controls" class="controls">Press <b>1–3</b> to choose · or click</p>
      </section>
    </div>
    <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ovTitle" hidden>
      <div class="panel">
        <p id="ovKicker" class="eyebrow"></p>
        <h2 id="ovTitle" class="title"></h2>
        <p id="ovLead" class="lead"></p>
        <div id="ovRules" class="rules" hidden></div>
        <div id="ovScore" class="result" hidden>
          <span>WEEK SCORE</span>
          <strong id="ovScoreValue">0</strong>
          <small id="ovBest">BEST 000</small>
        </div>
        <div id="ovWeekStats" class="week-stats" hidden>
          <div class="week-stat ask"><span>Questions</span><strong id="statAsk">0</strong></div>
          <div class="week-stat report"><span>Reports</span><strong id="statReport">0</strong></div>
          <div class="week-stat train"><span>Training</span><strong id="statTrain">0</strong></div>
        </div>
        <div id="ovMetrics" class="metrics"></div>
        <button id="ovBtn" class="btn" type="button">Clock in</button>
        <p id="ovFine" class="fine"></p>
      </div>
    </div>
  </div>
  <p class="hint">click or press 1–3 · ask · report · train · no timer</p>
<script>
(() => {
  'use strict';

  const W = 480;
  const H = 640;
  const TAU = Math.PI * 2;
  const BEST_KEY = 'firstweek.best.v1';

  const SPEAKERS = {
    Dana: {
      name: 'Dana Park',
      role: 'Store manager',
      initial: 'D',
      color: '#ffc86b',
    },
    Nico: {
      name: 'Nico Alvarez',
      role: 'Coworker · one year in',
      initial: 'N',
      color: '#ff8a7a',
    },
    Riley: {
      name: 'Riley',
      role: 'You · first week',
      initial: 'R',
      color: '#6ee7cf',
    },
    Narrator: {
      name: 'Riley’s log',
      role: 'End of shift',
      initial: 'R',
      color: '#9ab8b3',
    },
  };

  const SCENES = {
    front: 'FRONT COUNTER',
    aisle: 'DAIRY AISLE',
    stockroom: 'STOCKROOM',
    breakroom: 'BREAK ROOM',
  };

  const CATEGORY = {
    ASK: { label: 'ASK', tone: 'ask' },
    REPORT: { label: 'REPORT', tone: 'report' },
    TRAIN: { label: 'TRAINING', tone: 'train' },
    SAFE: { label: 'SAFE CALL', tone: 'safe' },
    UNSAFE: { label: 'SHORTCUT', tone: 'unsafe' },
  };

  const NODES = {
    /* ---------- MONDAY ---------- */
    d1_intro: {
      day: 1,
      scene: 'front',
      prop: 'none',
      speaker: 'Dana',
      mood: 'neutral',
      text: 'Riley, right? Welcome to Northlight. Before the morning rush, can you face the cereal aisle? You know what that means.',
      choices: [
        {
          label: '“Could you show me what ‘face’ means?”',
          kind: 'ASK',
          points: 30,
          flag: 'askedTask',
          feedback: 'You asked before guessing.',
          next: 'd1_ask',
        },
        {
          label: '“Nico, what does Dana mean by face?”',
          kind: 'ASK',
          points: 25,
          flag: 'askedNico',
          feedback: 'You asked a coworker for help.',
          next: 'd1_ask_nico',
        },
        {
          label: 'Say “got it” and figure it out alone.',
          kind: 'UNSAFE',
          points: 0,
          flag: 'guessedTask',
          feedback: 'You guessed instead of asking.',
          next: 'd1_guess',
        },
      ],
    },
    d1_ask: {
      day: 1,
      scene: 'aisle',
      prop: 'boxes',
      speaker: 'Dana',
      mood: 'smile',
      text: 'Face means pull every box to the front, labels out, and check the sell-by dates. Anything past today goes in the returns bin. Grab the date gun—I’ll check your first row.',
      next: 'd1_nico',
    },
    d1_ask_nico: {
      day: 1,
      scene: 'aisle',
      prop: 'boxes',
      speaker: 'Nico',
      mood: 'smile',
      text: 'Easy. Pull the boxes forward so the shelf looks full. Dates? Dana never checks those. You finish fast, but two expired boxes stay on the shelf. When Dana spots them, she raises an eyebrow. “Who told you that?”',
      next: 'd1_nico',
    },
    d1_guess: {
      day: 1,
      scene: 'aisle',
      prop: 'boxes',
      speaker: 'Dana',
      mood: 'concerned',
      text: 'You pull the boxes forward, but leave the stock cart sideways across the aisle. Dana wheels it clear. “A blocked aisle is a hazard, Riley. If a task is unclear, ask. That’s not a bad look—it’s the job.”',
      next: 'd1_nico',
    },
    d1_nico: {
      day: 1,
      scene: 'stockroom',
      prop: 'crate',
      speaker: 'Nico',

  const state = {
    mode: 'title',
    nodeId: 'd1_intro',
    score: 0,
    best: 0,
    stats: { ASK: 0, REPORT: 0, TRAIN: 0, SAFE: 0, UNSAFE: 0 },

    choices: [],
    history: [],
  };

  const pad3 = (n) => String(Math.max(0, Math.floor(n))).padStart(3, '0');
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  function readBest() {
    try {
      const v = Number(window.localStorage.getItem(BEST_KEY));
      return Number.isFinite(v) && v > 0 ? Math.floor(v) : 0;
    } catch (err) {
      return 0;
    }
  }

  function writeBest(value) {
    try {
      window.localStorage.setItem(BEST_KEY, String(value));
    } catch (err) {
      /* local storage can be unavailable in private mode or on file:// */
    }
  }

  state.best = readBest();

  function updateHud(flash) {
    scoreEl.textContent = pad3(state.score);
    bestEl.textContent = pad3(Math.max(state.best, state.score));
    if (flash) {
      scoreEl.classList.remove('flash');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('flash');
      window.setTimeout(() => scoreEl.classList.remove('flash'), 340);
    }
  }

  function currentSpeaker(node) {
    return SPEAKERS[node.speaker] || SPEAKERS.Narrator;
  }

  function resolve(value) {
    return typeof value === 'function' ? value(state) : value;
  }

  function updateFeedback() {
    const fb = state.feedback;
    if (!fb) {
      feedbackEl.hidden = true;
      outcomeEl.hidden = true;
      outcomeEl.textContent = '';
      return;
    }
    const category = CATEGORY[fb.kind] || CATEGORY.SAFE;
    feedbackEl.hidden = false;
    feedbackEl.className = `feedback ${category.tone}`;
    feedbackEl.textContent = fb.points > 0
      ? `${category.label} +${fb.points}`
      : `${category.label} · 0 PTS`;
    outcomeEl.hidden = false;
    outcomeEl.className = `outcome${fb.kind === 'UNSAFE' ? ' unsafe' : ''}`;
    outcomeEl.textContent = fb.feedback;
  }

  function makeChoiceButton(choice, index) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'choice';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = String(index + 1);
    key.setAttribute('aria-hidden', 'true');

    const text = document.createElement('span');
    text.className = 'choice-text';
    text.textContent = choice.label || 'Continue';

    button.append(key, text);
    button.addEventListener('click', () => {
      if (button.disabled) return;
      if (choice.continue) advance();
      else choose(index);
    });
    return button;
  }

  function makeContinueButton(label) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'choice final';

    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = '1';
    key.setAttribute('aria-hidden', 'true');

    const text = document.createElement('span');
    text.className = 'choice-text';
    text.textContent = label || 'Continue';

    button.append(key, text);
    button.addEventListener('click', () => {
      if (!button.disabled) advance();
    });
    return button;
  }

  function focusFirstChoice() {
    const first = choicesEl.querySelector('.choice');
    if (!first) return;
    try {
      first.focus({ preventScroll: true });
    } catch (err) {
      first.focus();
    }
  }

  function renderNode(nodeId) {
    const node = NODES[nodeId];
    if (!node) {
      showFinal();
      return;
    }
    state.nodeId = nodeId;
    state.mode = 'story';
    state.feedback = state.feedback || null;
    state.choices = node.choices ? node.choices.slice() : [];

    const speaker = currentSpeaker(node);
    portraitEl.textContent = speaker.initial;
    portraitEl.style.setProperty('--speaker', speaker.color);
    speakerNameEl.textContent = speaker.name;
    speakerRoleEl.textContent = speaker.role;

    dayTagEl.textContent = `DAY ${String(node.day).padStart(2, '0')} / 05`;
    sceneTagEl.textContent = SCENES[node.scene] || 'NORTHLIGHT MARKET';

    storyTextEl.textContent = resolve(node.text);
    updateFeedback();

    choicesEl.innerHTML = '';
    if (node.choices && node.choices.length) {
      node.choices.forEach((choice, index) => {
        choicesEl.appendChild(makeChoiceButton(choice, index));
      });
      controlsEl.innerHTML = `Press <b>1–${node.choices.length}</b> to choose · or click`;
    } else {
      choicesEl.appendChild(makeContinueButton(node.continueLabel));
      controlsEl.innerHTML = 'Press <b>Enter</b> or <b>1</b> to continue';
    }

    storyboxEl.scrollTop = 0;
    window.setTimeout(focusFirstChoice, 20);
  }

  function goTo(nodeId) {
    if (nodeId === '__final') {
      showFinal();
      return;
    }
    renderNode(nodeId);
  }

  function choose(index) {
    if (state.mode !== 'story') return;
    const node = NODES[state.nodeId];
    if (!node || !node.choices) return;
    const choice = node.choices[index];
    if (!choice) return;

    state.score += choice.points;
    state.stats[choice.kind] = (state.stats[choice.kind] || 0) + 1;
    if (choice.flag) state.flags[choice.flag] = true;
    state.feedback = {
      kind: choice.kind,
      points: choice.points,
      feedback: choice.feedback,
    };
    state.history.push({ node: state.nodeId, choice: choice.label, kind: choice.kind });
    updateHud(true);
    goTo(choice.next);
  }

  function advance() {
    if (state.mode !== 'story') return;
    const node = NODES[state.nodeId];
    if (!node || node.choices) return;
    state.feedback = null;
    goTo(node.next);
  }

  let overlayAction = null;

  function openOverlay(options) {
    ovKickerEl.textContent = options.kicker || '';
    ovTitleEl.textContent = options.title || '';
    ovLeadEl.textContent = options.lead || '';
    ovFineEl.textContent = options.fine || '';
    ovBtn.textContent = options.button || 'Continue';

    ovRulesEl.innerHTML = '';
    ovRulesEl.hidden = !(options.rules && options.rules.length);
    (options.rules || []).forEach((rule) => {
      const div = document.createElement('div');
      div.className = 'rule';
      div.textContent = rule;
      ovRulesEl.appendChild(div);
    });

    ovMetricsEl.hidden = !(options.metrics && options.metrics.length);
    ovMetricsEl.innerHTML = (options.metrics || []).map((metric) => (
      `<div class="metric"><span>${metric.label}</span><strong>${metric.value}</strong></div>`
    )).join('');

    ovScoreEl.hidden = !options.showScore;
    if (options.showScore) {
      ovScoreValueEl.textContent = pad3(state.score);
      ovBestEl.textContent = `BEST ${pad3(state.best)}`;
    }

    ovWeekStatsEl.hidden = !options.showStats;
    if (options.showStats) {
      statAskEl.textContent = String(state.stats.ASK);
      statReportEl.textContent = String(state.stats.REPORT);
      statTrainEl.textContent = String(state.stats.TRAIN);
    }

    overlayAction = options.onAction || null;
    ovBtn.onclick = () => {
      const action = overlayAction;
      overlayAction = null;
      if (action) action();
    };

    document.getElementById('ui').setAttribute('inert', '');
    overlayEl.hidden = false;
    try {
      ovBtn.focus({ preventScroll: true });
    } catch (err) {
      ovBtn.focus();
    }

  function resetRun() {
    state.nodeId = 'd1_intro';
    state.score = 0;
    state.best = readBest();
    state.stats = { ASK: 0, REPORT: 0, TRAIN: 0, SAFE: 0, UNSAFE: 0 };
    state.flags = {};
    state.feedback = null;
    state.choices = [];
    state.history = [];

  function showTitle() {
    resetRun();
    state.mode = 'title';
    openOverlay({
      kicker: 'NORTHLIGHT MARKET · WEEK ONE',
      title: 'First Week',
      lead: 'You’re Riley, sixteen, starting your first job. Ask when instructions are unclear. Report hazards. Ask for training. Nico will keep offering shortcuts.',
      rules: [

        'Every choice branches to a different consequence.',

  }

  function showFinal() {
    if (state.score > state.best) {
      state.best = state.score;
      writeBest(state.best);
    }
    updateHud(false);

    let rank = 'Rough start';
    if (state.score >= 280 && state.stats.UNSAFE === 0) rank = 'Safety star';
    else if (state.score >= 210) rank = 'Trusted shift';
    else if (state.score >= 130) rank = 'Learning fast';

    let lead;
    if (state.stats.UNSAFE === 0) {
      lead = 'You made it through your first week without taking a single shortcut. Dana noticed. So did Nico.';
    } else if (state.stats.UNSAFE < 3) {
      lead = 'You made it through the week. A few shortcuts cost you points, but you kept showing up and learning.';
    } else {
      lead = 'It was a rough week. Shortcuts stacked up, but the report makes the next shift a fresh start.';
    }

    state.mode = 'final';
    openOverlay({
      kicker: 'WEEK ONE COMPLETE',
      title: rank,
      lead,
      showScore: true,
      showStats: true,
      metrics: [
        { label: 'Safe calls', value: String(state.stats.SAFE) },
        { label: 'Shortcuts', value: String(state.stats.UNSAFE) },
        { label: 'Days', value: '5 / 5' },

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', (event) => {
    if (!overlayEl.hidden) {
      if (event.key === '1') {
        event.preventDefault();
        ovBtn.click();
      }
      return;
    }
    if (state.mode !== 'story') return;

    if (/^[1-4]$/.test(event.key)) {
      const index = Number(event.key) - 1;
      if (state.choices.length) {
        event.preventDefault();
        choose(index);
      } else if (event.key === '1') {
        event.preventDefault();
        advance();
      }
      return;
    }

    if (event.key === 'Enter' || event.key === ' ') {
      const active = document.activeElement;
      if (active && active.tagName === 'BUTTON') return;
      if (!state.choices.length) {
        event.preventDefault();
        advance();

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function rr(x, y, w, h, radius) {
    const r = Math.min(radius, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawScene() {
    const node = NODES[state.nodeId] || NODES.d1_intro;
    const scene = node.scene || 'front';
    const prop = node.prop || 'none';
    const t = performance.now() / 1000;

    if (!bgGradient) {
      bgGradient = ctx.createLinearGradient(0, 0, 0, H);
      bgGradient.addColorStop(0, '#132324');
      bgGradient.addColorStop(0.58, '#091315');
      bgGradient.addColorStop(1, '#04090a');
      vignette = ctx.createRadialGradient(W / 2, H * 0.37, 60, W / 2, H * 0.37, 380);
      vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
      vignette.addColorStop(1, 'rgba(0, 0, 0, 0.54)');
    }
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, W, H);

    drawWall(scene);
    if (scene === 'front') drawFront(t);
    else if (scene === 'aisle') drawAisle(t, prop);
    else if (scene === 'stockroom') drawStockroom(t, prop);
    else if (scene === 'breakroom') drawBreakroom(t, prop);

    drawFloor(t);

    if (prop === 'checklist') drawChecklist();

    const speakerKey = node.speaker;
    const speaker = SPEAKERS[speakerKey] || SPEAKERS.Narrator;
    const mood = resolve(node.mood) || 'neutral';

    if (speakerKey === 'Dana' || speakerKey === 'Nico') {
      drawPerson(146, 348, 'Riley', 'neutral', false, t, 0.86);
      drawPerson(340, 346, speakerKey, mood, true, t, 1);
    } else {
      drawPerson(252, 348, 'Riley', mood, speakerKey === 'Riley', t, 0.96);
    }

    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    // dim the area behind the dialogue without hiding the characters
    const fade = ctx.createLinearGradient(0, 300, 0, 420);
    fade.addColorStop(0, 'rgba(5, 11, 12, 0)');
    fade.addColorStop(1, 'rgba(5, 11, 12, 0.55)');
    ctx.fillStyle = fade;
    ctx.fillRect(0, 300, W, 130);
  }

  function drawPerson(x, baseY, personId, mood, active, t, scale) {
    const p = PEOPLE[personId] || PEOPLE.Riley;
    const bob = Math.sin(t * 1.7 + x * 0.03) * 1.3;
    const blink = Math.sin(t * 0.83 + x * 0.05) > 0.985;
    const s = scale;

    ctx.save();
    ctx.translate(x, baseY + bob);
    ctx.scale(s, s);

    if (active) {
      ctx.fillStyle = 'rgba(110, 231, 207, 0.09)';
      ctx.beginPath();
      ctx.ellipse(0, 2, 47, 8, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 200, 107, 0.32)';
      ctx.beginPath();
      ctx.ellipse(0, 4, 42, 6, 0, 0, TAU);
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
      ctx.beginPath();
      ctx.ellipse(0, 3, 40, 6, 0, 0, TAU);
      ctx.fill();
    }

    // legs
    ctx.fillStyle = '#182324';
    ctx.fillRect(-17, -54, 13, 56);
    ctx.fillRect(4, -54, 13, 56);

    // body
    ctx.fillStyle = p.shirt;
    rr(-28, -132, 56, 82, 13);
    ctx.fill();

    // apron
    ctx.fillStyle = p.apron;
    rr(-23, -122, 46, 70, 8);
    ctx.fill();
    ctx.fillStyle = p.apronDark;
    ctx.fillRect(-3, -122, 6, 27);
    ctx.fillRect(-23, -80, 46, 4);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
    ctx.fillRect(10, -108, 12, 6);
    ctx.fillStyle = 'rgba(20, 27, 28, 0.65)';
    ctx.fillRect(11, -107, 10, 1);

    // arms
    ctx.strokeStyle = p.skin;
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-25, -116);
    ctx.lineTo(-34, -82);
    ctx.lineTo(-28, -62);
    ctx.moveTo(25, -116);
    ctx.lineTo(34, -84);
    ctx.lineTo(28, -64);
    ctx.stroke();

    // neck
    ctx.fillStyle = p.skin;
    ctx.fillRect(-8, -146, 16, 18);

    // ears
    ctx.fillStyle = p.skin;
    ctx.beginPath();
    ctx.arc(-22, -169, 5, 0, TAU);
    ctx.arc(22, -169, 5, 0, TAU);
    ctx.fill();

    // head
    ctx.beginPath();
    ctx.ellipse(0, -172, 23, 26, 0, 0, TAU);
    ctx.fill();

    // hair
    ctx.fillStyle = p.hair;
    if (p.hairStyle === 'cap') {
      ctx.beginPath();
      ctx.arc(0, -184, 23, Math.PI, TAU);
      ctx.fill();
      ctx.fillRect(-24, -187, 40, 5);
      ctx.fillStyle = '#7a302c';
      ctx.fillRect(-4, -209, 8, 7);
      ctx.fillStyle = p.hair;
    } else if (p.hairStyle === 'bun') {
      ctx.beginPath();
      ctx.arc(0, -181, 23, Math.PI, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(18, -199, 10, 0, TAU);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, -184, 23, Math.PI * 0.94, TAU * 1.02);
      ctx.lineTo(22, -166);
      ctx.lineTo(12, -177);
      ctx.lineTo(-4, -164);
      ctx.lineTo(-16, -178);
      ctx.lineTo(-23, -166);
      ctx.closePath();
      ctx.fill();
    }

    // face
    const eyeY = -174;
    ctx.strokeStyle = '#231b18';
    ctx.fillStyle = '#231b18';
    ctx.lineWidth = 2;
    if (blink) {
      ctx.beginPath();
      ctx.moveTo(-15, eyeY);
      ctx.lineTo(-7, eyeY);
      ctx.moveTo(7, eyeY);
      ctx.lineTo(15, eyeY);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(-11, eyeY, 2.1, 0, TAU);
      ctx.arc(11, eyeY, 2.1, 0, TAU);
      ctx.fill();
    }

    ctx.strokeStyle = 'rgba(60, 38, 29, 0.75)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (mood === 'concerned' || mood === 'stern') {
      ctx.moveTo(-15, -183);
      ctx.lineTo(-7, -185);
      ctx.moveTo(7, -185);
      ctx.lineTo(15, -183);
    } else {
      ctx.moveTo(-15, -185);
      ctx.lineTo(-7, -185);
      ctx.moveTo(7, -185);
      ctx.lineTo(15, -185);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(75, 39, 31, 0.8)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    if (mood === 'smile') {
      ctx.arc(0, -162, 8, 0.18, Math.PI - 0.18);
    } else if (mood === 'concerned') {
      ctx.arc(0, -154, 6, Math.PI + 0.25, TAU - 0.25);
    } else if (mood === 'stern' || mood === 'annoyed') {
      ctx.moveTo(-6, -157);
      ctx.lineTo(6, -157);
    } else {
      ctx.moveTo(-6, -158);
      ctx.lineTo(6, -158);
    }
    ctx.stroke();

    ctx.restore();
  }

  function frame(now) {
    drawScene();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  // Read-only test hook for the local verification harness.
  window.__FIRSTWEEK__ = {
    state,
    nodes: NODES,
    speakers: SPEAKERS,
    scenes: SCENES,
    choose,
    advance,
    renderNode,
    showTitle,
    showFinal,
    resolve,
  };
})();

</script>
