<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>Creature Nursery</title>
<link rel="stylesheet" href="../common.css">
<style>
  :root {
    --bg-top: #1c2c33;
    --bg-mid: #0a1014;
    --bg-bottom: #06090b;
    --stage-bg: #0a1013;
    --ink: #eafff6;
    --stage-offset: 122px;
  }
  .actions { display: flex; gap: 8px; }
  .act {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
    padding: 10px 18px;
    border: 1px solid rgba(234, 255, 246, 0.15);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.035);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transition: background 120ms ease, border-color 120ms ease, transform 100ms ease;
  }
  .act .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }
  .act.feed { color: #ffc65c; }
  .act.clean { color: #6fd8f5; }
  .act.train { color: #c7a6ff; }
  .act:hover:not(:disabled) { background: rgba(255, 255, 255, 0.075); border-color: rgba(234, 255, 246, 0.3); }
  .act:active:not(:disabled) { transform: translateY(1px); }
  .act:focus-visible { outline: 2px solid #bff9ec; outline-offset: 3px; }
  .act:disabled { opacity: 0.34; cursor: default; }
  .panel { max-width: 380px; }
  .title { color: #8fffdc; }
  .score {
    font-size: 50px;
    line-height: 1;
    font-weight: 700;
    color: #8fffdc;
    text-shadow: 0 0 30px rgba(94, 231, 199, 0.35);
  }
  .best {
    margin: 10px 0 0;
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: 0.03em;
    text-transform: none;
    color: rgba(234, 255, 246, 0.66);
  }
  .dex {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 12px;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.07);
  }
  .dex-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(234, 255, 246, 0.36);
    text-align: left;
  }
  .dex-item.found { color: #bff9ec; }
  .dex-item .pip {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    flex: none;
  }
  .dex-item.found .pip { background: #5ee7c7; box-shadow: 0 0 7px rgba(94, 231, 199, 0.8); }
  .btn { margin-top: 20px; padding: 14px 30px; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="640" aria-label="Creature nursery. Feed, clean, and train your creature to discover evolutions."></canvas>
    <div id="overlay" class="overlay" hidden>
      <div class="panel">
        <p class="eyebrow">Evolution complete</p>
        <h1 class="title" id="ovTitle">Aurora</h1>
        <p class="label">Care rank</p>
        <p class="score" id="ovScore">A</p>
        <p class="best" id="ovSub">A luminous little friend.</p>
        <div class="dex" id="ovDex"></div>
        <button type="button" id="ovBtn" class="btn">New creature</button>
      </div>
    </div>
  </div>
  <div class="actions">
    <button type="button" class="act feed" id="feedBtn"><span class="dot"></span>Feed</button>
    <button type="button" class="act clean" id="cleanBtn"><span class="dot"></span>Clean</button>
    <button type="button" class="act train" id="trainBtn"><span class="dot"></span>Train</button>
  </div>
  <p class="hint">1 feed &middot; 2 clean &middot; 3 train &middot; care shapes the evolution</p>

<script>
(() => {
  'use strict';

  const W = 480;
  const H = 640;
  const TAU = Math.PI * 2;
  const DEX_KEY = 'nursery.dex.v1';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovScore = document.getElementById('ovScore');
  const ovSub = document.getElementById('ovSub');
  const ovDex = document.getElementById('ovDex');
  const ovBtn = document.getElementById('ovBtn');
  const feedBtn = document.getElementById('feedBtn');
  const cleanBtn = document.getElementById('cleanBtn');
  const trainBtn = document.getElementById('trainBtn');

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const rand = (lo, hi) => lo + Math.random() * (hi - lo);

  const STAGE_NAMES = ['HATCHLING', 'JUVENILE', 'ADULT'];
  const STAGE_START = [0, 50, 120];
  const STAGE_END = [50, 120, 120];
  const BALANCE_GAP = 16;

  const FORMS = {
    baby: {
      name: 'Mossling', desc: 'A soft sprout freshly hatched.',
      hue: '#8fe3c0', light: '#dcfff1', dark: '#2f8f74', belly: '#f2fffa',
      rx: 44, ry: 40, scale: 0.9, eye: 12,
    },
    sprout: {
      name: 'Sprig', desc: 'Balanced care grew a gentle, leaf-crowned friend.',
      hue: '#7fdcae', light: '#d6ffe9', dark: '#2b8060', belly: '#f4fff9',
      rx: 45, ry: 53, scale: 1, eye: 13,
    },
    puff: {
      name: 'Puffcap', desc: 'Every snack went straight to the cap.',
      hue: '#ffbe72', light: '#ffe3bd', dark: '#b06a20', belly: '#fff4e0',
      rx: 58, ry: 49, scale: 1, eye: 12,
    },
    dew: {
      name: 'Dewtail', desc: 'A polished little prankster with a bubble crest.',
      hue: '#7bdff2', light: '#d9f9ff', dark: '#2a7f9e', belly: '#f0feff',
      rx: 43, ry: 55, scale: 1, eye: 14,
    },
    tussle: {
      name: 'Tussle', desc: 'Feisty, focused, and always ready to spar.',
      hue: '#f28fa8', light: '#ffd6e0', dark: '#a83d5c', belly: '#fff1f5',
      rx: 51, ry: 47, scale: 1, eye: 12,
    },
    aurora: {
      name: 'Aurora', desc: 'Perfect balance made something luminous.',
      hue: '#c3a6ff', light: '#f0e6ff', dark: '#6a4bb0', belly: '#fff4ff',
      rx: 46, ry: 60, scale: 1.12, eye: 14, final: true,
    },
    glutton: {
      name: 'Gluttonmaw', desc: 'A bottomless, cheerful appetite.',
      hue: '#ffa36b', light: '#ffd9b8', dark: '#a8501e', belly: '#ffeede',
      rx: 63, ry: 56, scale: 1.1, eye: 8, final: true,
    },
    pearl: {
      name: 'Pearlwing', desc: 'A poised creature with a pearl for a heart.',
      hue: '#a8e8ff', light: '#eafaff', dark: '#4a88aa', belly: '#f8ffff',
      rx: 41, ry: 57, scale: 1.06, eye: 13, final: true,
    },
    cinder: {
      name: 'Cinderclaw', desc: 'A fierce little furnace with a soft spot for you.',
      hue: '#ff8a5c', light: '#ffd2b8', dark: '#96331a', belly: '#ffe3d1',
      rx: 52, ry: 49, scale: 1.1, eye: 12, final: true,
    },
  };

  const FINAL_FORMS = ['aurora', 'glutton', 'pearl', 'cinder'];
  const FINAL_NAMES = { aurora: 'Aurora', glutton: 'Gluttonmaw', pearl: 'Pearlwing', cinder: 'Cinderclaw' };

  /* ---------- persistence ---------- */
  function readDex() {
    try {
      const raw = window.localStorage.getItem(DEX_KEY);
      const parsed = JSON.parse(raw || '[]');
      if (!Array.isArray(parsed)) return [];
      return parsed.filter((id) => FINAL_FORMS.indexOf(id) >= 0);
    } catch (err) {
      return [];
    }
  }

  function writeDex(list) {
    try {
      window.localStorage.setItem(DEX_KEY, JSON.stringify(list));
    } catch (err) {
      /* ignore */
    }
  }

  /* ---------- state ---------- */
  const state = {
    form: 'baby',
    stage: 0,
    growth: 0,
    food: 55,
    clean: 68,
    train: 30,
    bond: 48,
    mode: 'care',
    t: 0,
    decay: 0,
    react: null,
    bubble: null,
    blink: 0,
    blinkTimer: 2.4,
    evo: null,
    flash: 0,
    shake: 0,
    particles: [],
    dex: readDex(),
    pointer: { x: 240, y: 260, active: false },
    drawFood: 55,
    drawClean: 68,
    drawTrain: 30,
    drawBond: 48,
  };

  /* ---------- canvas setup ---------- */
  let bgGradient = null;

  function sizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bgGradient = null;
  }

  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  /* ---------- ambient ---------- */
  const spores = [];
  for (let i = 0; i < 22; i++) {
    spores.push({
      x: rand(30, 450), y: rand(120, 470),
      r: rand(1, 2.6), sp: rand(3, 10), p: rand(0, TAU), a: rand(0.12, 0.4),
    });
  }
  const fireflies = [];
  for (let i = 0; i < 14; i++) {
    fireflies.push({ x: rand(10, 470), y: rand(60, 560), p: rand(0, TAU), sp: rand(0.4, 1.1), r: rand(1, 2.2) });
  }
  const dirtSpots = [];
  for (let i = 0; i < 9; i++) {
    dirtSpots.push({ x: rand(-0.6, 0.6), y: rand(-0.5, 0.5), r: rand(1.6, 3.3) });
  }

  /* ---------- helpers ---------- */
  function form() {
    return FORMS[state.form];
  }

  function careStats() {
    return [state.food, state.clean, state.train];
  }

  function topStats() {
    const vals = careStats();
    const order = [0, 1, 2].sort((a, b) => vals[b] - vals[a]);
    return { vals, order, gap: vals[order[0]] - vals[order[1]] };
  }

  function careTag() {
    const t = topStats();
    if (t.gap <= BALANCE_GAP) return { text: 'BALANCED', color: '#8fffdc' };
    return { text: 'LEANING ' + ['FOOD', 'CLEAN', 'TRAIN'][t.order[0]], color: ['#ffc65c', '#6fd8f5', '#c7a6ff'][t.order[0]] };
  }

  function moodText() {
    if (state.mode === 'evolving') return 'Evolving...';
    if (state.mode === 'done') return 'Fully grown.';
    if (state.food < 25) return 'Hungry...';
    if (state.clean < 25) return 'Grubby...';
    if (state.train < 20) return 'Restless...';
    if (state.food > 70 && state.clean > 70 && state.train > 55) return 'Thriving!';
    return 'Content.';
  }

  function pickForm(stage) {
    const t = topStats();
    const balanced = t.gap <= BALANCE_GAP;
    if (stage === 1) {
      if (balanced) return 'sprout';
      return ['puff', 'dew', 'tussle'][t.order[0]];
    }
    if (balanced) return 'aurora';
    return ['glutton', 'pearl', 'cinder'][t.order[0]];
  }

  function careRank() {
    const avg = (state.food + state.clean + state.train) / 3;
    const score = avg * 0.7 + state.bond * 0.3;
    if (score >= 82) return { letter: 'S', label: 'Radiant' };
    if (score >= 68) return { letter: 'A', label: 'Thriving' };
    if (score >= 52) return { letter: 'B', label: 'Steady' };
    return { letter: 'C', label: 'Frail' };
  }

  /* ---------- care actions ---------- */
  function spawn(type) {
    const cx = 240;
    const cy = 300;

    if (type === 'feed') {
      for (let i = 0; i < 12; i++) {
        const a = rand(-Math.PI * 0.9, -Math.PI * 0.1);
        state.particles.push({
          x: cx + rand(-18, 18), y: cy + 10,
          vx: Math.cos(a) * rand(30, 110), vy: Math.sin(a) * rand(30, 120),
          grav: 320, life: rand(0.4, 0.8), max: 0.8, size: rand(2, 4),
          color: i % 3 === 0 ? '#8b6b3d' : '#e8b96b', shape: 'crumb', rot: rand(0, TAU), spin: rand(-6, 6),
        });
      }
      for (let i = 0; i < 3; i++) {
        state.particles.push({
          x: cx + rand(-24, 24), y: cy - 24,
          vx: rand(-16, 16), vy: rand(-60, -34),
          grav: -12, life: rand(0.8, 1.2), max: 1.2, size: rand(3, 5),
          color: '#ff8fa3', shape: 'heart', rot: 0, spin: 0,
        });
      }
    } else if (type === 'clean') {
      for (let i = 0; i < 16; i++) {
        state.particles.push({
          x: cx + rand(-58, 58), y: cy + rand(-34, 48),
          vx: rand(-18, 18), vy: rand(-70, -30),
          grav: -18, life: rand(0.6, 1.2), max: 1.2, size: rand(2.5, 6),
          color: i % 4 === 0 ? '#d9f9ff' : '#6fd8f5', shape: 'bubble', rot: 0, spin: 0,
        });
      }
    } else {
      for (let i = 0; i < 14; i++) {
        const a = rand(0, TAU);
        state.particles.push({
          x: cx, y: cy + 10,
          vx: Math.cos(a) * rand(60, 170), vy: Math.sin(a) * rand(60, 170) - 30,
          grav: 200, life: rand(0.35, 0.7), max: 0.7, size: rand(2.5, 5),
          color: i % 2 === 0 ? '#ffd166' : '#c7a6ff', shape: 'star', rot: rand(0, TAU), spin: rand(-8, 8),
        });
      }
    }
  }

  function care(type) {
    if (state.mode !== 'care') return;
    const field = type === 'feed' ? 'food' : type === 'clean' ? 'clean' : 'train';
    const before = state[field];
    const gain = type === 'clean' ? 30 : 26;
    state[field] = clamp(before + gain, 0, 100);
    const effective = state[field] - before;

    if (type === 'feed') state.clean = clamp(state.clean - 4, 0, 100);
    if (type === 'train') {
      state.clean = clamp(state.clean - 6, 0, 100);
      state.food = clamp(state.food - 4, 0, 100);
    }

    state.growth += 2.5 + effective * 0.2;
    state.bond = clamp(state.bond + (effective > 10 ? 2.4 : 0.6), 0, 100);

    state.react = { type, t: 0.9 };
    state.bubble = {
      text: type === 'feed' ? 'nom!' : type === 'clean' ? 'so fresh!' : 'hyah!',
      t: 1.3,
      color: type === 'feed' ? '#ffc65c' : type === 'clean' ? '#6fd8f5' : '#c7a6ff',
    };
    spawn(type);
    checkEvolution();
  }

  /* ---------- evolution ---------- */
  function checkEvolution() {
    if (state.mode !== 'care') return;
    if (state.stage === 0 && state.growth >= STAGE_START[1]) startEvolution(1);
    else if (state.stage === 1 && state.growth >= STAGE_START[2]) startEvolution(2);
  }

  function startEvolution(nextStage) {
    const formId = pickForm(nextStage);
    state.mode = 'evolving';
    state.evo = { timer: 1.6, form: formId, stage: nextStage, switched: false };
    state.flash = 1;
    state.shake = 8;
    state.bubble = null;
    syncButtons();

    for (let i = 0; i < 22; i++) {
      const a = rand(0, TAU);
      const sp = rand(60, 200);
      state.particles.push({
        x: 240, y: 300,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        grav: 30, life: rand(0.5, 1.1), max: 1.1, size: rand(2, 5),
        color: i % 2 ? '#8fffdc' : '#ffd166', shape: 'star', rot: rand(0, TAU), spin: rand(-7, 7),
      });
    }
  }

  function finishEvolution() {
    if (state.stage === 2) {
      state.mode = 'done';
      const id = state.form;
      if (state.dex.indexOf(id) < 0) {
        state.dex.push(id);
        writeDex(state.dex);
      }
      showOverlay();
    } else {
      state.mode = 'care';
      state.bubble = { text: FORMS[state.form].name + '!', t: 2.4, color: '#8fffdc' };
      syncButtons();
    }
  }

  function showOverlay() {
    const rank = careRank();
    ovTitle.textContent = FORMS[state.form].name;
    ovScore.textContent = rank.letter;
    ovSub.textContent = FORMS[state.form].desc + '  ·  ' + rank.label + ' care.';
    overlay.hidden = false;

    ovDex.textContent = '';
    for (const id of FINAL_FORMS) {
      const item = document.createElement('div');
      item.className = 'dex-item' + (state.dex.indexOf(id) >= 0 ? ' found' : '');
      const pip = document.createElement('span');
      pip.className = 'pip';
      const label = document.createElement('span');
      label.textContent = state.dex.indexOf(id) >= 0 ? FINAL_NAMES[id] : '???';
      item.appendChild(pip);
      item.appendChild(label);
      ovDex.appendChild(item);
    }
    try {
      ovBtn.focus({ preventScroll: true });
    } catch (err) {
      ovBtn.focus();
    }
  }

  function startRun() {
    state.form = 'baby';
    state.stage = 0;
    state.growth = 0;
    state.food = 55;
    state.clean = 68;
    state.train = 30;
    state.bond = 48;
    state.mode = 'care';
    state.decay = 0;
    state.react = null;
    state.bubble = null;
    state.evo = null;
    state.flash = 0;
    state.shake = 0;
    state.particles.length = 0;
    state.drawFood = state.food;
    state.drawClean = state.clean;
    state.drawTrain = state.train;
    state.drawBond = state.bond;
    overlay.hidden = true;
    syncButtons();
  }

  function syncButtons() {
    const on = state.mode === 'care';
    feedBtn.disabled = !on;
    cleanBtn.disabled = !on;
    trainBtn.disabled = !on;
  }

  /* ---------- update ---------- */
  function updateParticles(dt) {
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        state.particles.splice(i, 1);
        continue;
      }
      p.vy += (p.grav || 0) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += (p.spin || 0) * dt;
    }
  }

  function update(dt) {
    state.t += dt;

    const ease = 1 - Math.exp(-dt * 9);
    state.drawFood += (state.food - state.drawFood) * ease;
    state.drawClean += (state.clean - state.drawClean) * ease;
    state.drawTrain += (state.train - state.drawTrain) * ease;
    state.drawBond += (state.bond - state.drawBond) * ease;

    state.flash = Math.max(0, state.flash - dt * 2.2);
    state.shake = Math.max(0, state.shake - dt * 30);

    if (state.react) {
      state.react.t -= dt;
      if (state.react.t <= 0) state.react = null;
    }
    if (state.bubble) {
      state.bubble.t -= dt;
      if (state.bubble.t <= 0) state.bubble = null;
    }

    state.blinkTimer -= dt;
    if (state.blinkTimer <= 0) {
      state.blink = 0.13;
      state.blinkTimer = rand(2.2, 5);
    } else if (state.blink > 0) {
      state.blink -= dt;
    }

    updateParticles(dt);

    if (state.mode === 'care') {
      state.decay += dt;
      if (state.decay >= 2.8) {
        state.decay -= 2.8;
        state.food = clamp(state.food - 2.2, 0, 100);
        state.clean = clamp(state.clean - 2.2, 0, 100);
        state.train = clamp(state.train - 1.3, 0, 100);
        const lowest = Math.min(state.food, state.clean, state.train);
        state.bond = clamp(state.bond + (lowest < 15 ? -1.4 : 0.25), 0, 100);
      }
    }

    if (state.mode === 'evolving' && state.evo) {
      state.evo.timer -= dt;
      if (!state.evo.switched && state.evo.timer <= 0.8) {
        state.evo.switched = true;
        state.form = state.evo.form;
        state.stage = state.evo.stage;
        state.flash = 1;
        state.shake = 10;
        for (let i = 0; i < 24; i++) {
          const a = rand(0, TAU);
          const sp = rand(80, 250);
          state.particles.push({
            x: 240, y: 292,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            grav: 40, life: rand(0.5, 1.1), max: 1.1, size: rand(2, 5),
            color: i % 2 ? '#8fffdc' : '#ffd166', shape: 'star', rot: rand(0, TAU), spin: rand(-7, 7),
          });
        }
      }
      if (state.evo.timer <= 0) {
        state.evo = null;
        finishEvolution();
      }
    }
  }

  /* ---------- drawing helpers ---------- */
  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.32);
    ctx.bezierCurveTo(x - s * 0.7, y - s * 0.28, x - s * 0.32, y - s * 0.62, x, y - s * 0.18);
    ctx.bezierCurveTo(x + s * 0.32, y - s * 0.62, x + s * 0.7, y - s * 0.28, x, y + s * 0.32);
    ctx.closePath();
  }

  function starPath(x, y, r, points, inner) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const a = (i * Math.PI) / points - Math.PI / 2;
      const rr = i % 2 === 0 ? r : r * inner;
      const px = x + Math.cos(a) * rr;
      const py = y + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function leafShape(x, y, rot, len, wid, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len * 0.5, -wid, len, 0);
    ctx.quadraticCurveTo(len * 0.5, wid, 0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function flameShape(x, y, s, color, inner) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y - s);
    ctx.quadraticCurveTo(x + s * 0.9, y - s * 0.1, x, y + s * 0.6);
    ctx.quadraticCurveTo(x - s * 0.9, y - s * 0.1, x, y - s);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = inner;
    ctx.beginPath();
    ctx.moveTo(x, y - s * 0.55);
    ctx.quadraticCurveTo(x + s * 0.45, y, x, y + s * 0.35);
    ctx.quadraticCurveTo(x - s * 0.45, y, x, y - s * 0.55);
    ctx.closePath();
    ctx.fill();
  }

  /* ---------- background ---------- */
  function drawBackground(t) {
    if (!bgGradient) {
      bgGradient = ctx.createLinearGradient(0, 0, 0, H);
      bgGradient.addColorStop(0, '#152a2c');
      bgGradient.addColorStop(0.5, '#0b1518');
      bgGradient.addColorStop(1, '#070c0e');
    }
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, W, H);

    // hanging vines
    ctx.strokeStyle = 'rgba(94, 180, 140, 0.18)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const x = 40 + i * 130;
      const sway = Math.sin(t * 0.6 + i) * 6;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.bezierCurveTo(x + 8, 40, x - 8 + sway, 70, x + sway, 110);
      ctx.stroke();
      for (let j = 0; j < 3; j++) {
        leafShape(x + sway * (j / 3), 40 + j * 24, 0.6 + j * 0.4, 9, 3.5, 'rgba(110, 210, 165, 0.28)');
      }
    }

    for (const f of fireflies) {
      const x = f.x + Math.sin(t * f.sp + f.p) * 14;
      const y = f.y + Math.cos(t * f.sp * 0.7 + f.p) * 9;
      const glow = ctx.createRadialGradient(x, y, 0, x, y, f.r * 6);
      glow.addColorStop(0, 'rgba(190, 255, 214, 0.5)');
      glow.addColorStop(1, 'rgba(190, 255, 214, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, f.r * 6, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(225, 255, 235, 0.85)';
      ctx.beginPath();
      ctx.arc(x, y, f.r, 0, TAU);
      ctx.fill();
    }

    const vg = ctx.createRadialGradient(W / 2, H * 0.42, 120, W / 2, H * 0.42, 460);
    vg.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vg.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  /* ---------- pod ---------- */
  const POD = { x: 240, y: 286, r: 136 };

  function stageProgress() {
    const start = STAGE_START[state.stage];
    const end = STAGE_END[state.stage];
    if (end <= start) return 1;
    return clamp((state.growth - start) / (end - start), 0, 1);
  }

  function drawPodBack(t) {
    const { x, y, r } = POD;

    const glow = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 1.8);
    glow.addColorStop(0, 'rgba(94, 231, 199, 0.12)');
    glow.addColorStop(1, 'rgba(94, 231, 199, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // growth ring
    ctx.beginPath();
    ctx.arc(x, y, r + 14, 0, TAU);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
    ctx.lineWidth = 7;
    ctx.stroke();

    const prog = stageProgress();
    if (prog > 0.002) {
      ctx.beginPath();
      ctx.arc(x, y, r + 14, -Math.PI / 2, -Math.PI / 2 + TAU * prog);
      ctx.strokeStyle = state.stage === 2 ? '#8fffdc' : '#5ee7c7';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(94, 231, 199, 0.7)';
      ctx.shadowBlur = 14;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // interior
    const inside = ctx.createRadialGradient(x - r * 0.25, y - r * 0.4, r * 0.2, x, y, r);
    inside.addColorStop(0, '#173e3b');
    inside.addColorStop(0.55, '#102a2a');
    inside.addColorStop(1, '#081614');
    ctx.fillStyle = inside;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();

    // moss nest
    ctx.fillStyle = '#1c4a3c';
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.66, r * 0.62, r * 0.2, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#27634e';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.22, y + r * 0.61, r * 0.34, r * 0.13, -0.2, 0, TAU);
    ctx.ellipse(x + r * 0.26, y + r * 0.64, r * 0.3, r * 0.12, 0.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(120, 220, 170, 0.25)';
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.7, r * 0.5, r * 0.06, 0, 0, TAU);
    ctx.fill();

    for (const s of spores) {
      const sy = POD.y - POD.r * 0.55 + ((s.y - 120 + t * s.sp) % 330);
      const sx = s.x + Math.sin(t * 0.5 + s.p) * 8;
      ctx.globalAlpha = s.a * (0.6 + 0.4 * Math.sin(t + s.p));
      ctx.fillStyle = '#bff9ec';
      ctx.beginPath();
      ctx.arc(sx, sy, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPodFront(t) {
    const { x, y, r } = POD;

    // glass curve
    ctx.strokeStyle = 'rgba(200, 255, 240, 0.22)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, r - 5, Math.PI * 1.12, Math.PI * 1.62);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(200, 255, 240, 0.1)';
    ctx.beginPath();
    ctx.arc(x, y, r - 18, Math.PI * 1.2, Math.PI * 1.5);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.strokeStyle = 'rgba(160, 255, 225, 0.32)';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, r + 4, 0, TAU);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  /* ---------- creature ---------- */
  function drawTail(f, t) {
    const id = state.form;
    const sway = Math.sin(t * 1.8) * 6;

    if (id === 'baby' || id === 'sprout') {
      leafShape(-f.rx * 0.9, f.ry * 0.3, 2.5 + sway * 0.04, 22, 8, f.dark);
    } else if (id === 'puff' || id === 'glutton') {
      ctx.fillStyle = f.dark;
      ctx.beginPath();
      ctx.arc(-f.rx * 0.92, f.ry * 0.28, 11, 0, TAU);
      ctx.fill();
    } else if (id === 'dew') {
      ctx.fillStyle = f.dark;
      ctx.beginPath();
      ctx.moveTo(-f.rx * 0.8, f.ry * 0.2);
      ctx.quadraticCurveTo(-f.rx * 1.5, f.ry * 0.55 + sway, -f.rx * 1.15, f.ry * 0.85);
      ctx.quadraticCurveTo(-f.rx * 0.95, f.ry * 0.5, -f.rx * 0.8, f.ry * 0.2);
      ctx.fill();
    } else if (id === 'tussle') {
      ctx.strokeStyle = f.dark;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-f.rx * 0.85, f.ry * 0.5);
      ctx.quadraticCurveTo(-f.rx * 1.4, f.ry * 0.3 + sway, -f.rx * 1.25, -f.ry * 0.1);
      ctx.stroke();
    } else if (id === 'aurora') {
      ctx.strokeStyle = 'rgba(143, 255, 220, 0.55)';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      for (let i = 0; i < 2; i++) {
        ctx.beginPath();
        ctx.moveTo(-f.rx * 0.75, f.ry * 0.1 + i * 12);
        ctx.quadraticCurveTo(-f.rx * 1.7, f.ry * 0.3 + sway + i * 10, -f.rx * 1.35, f.ry * 0.95 + i * 8);
        ctx.stroke();
      }
    } else if (id === 'pearl') {
      ctx.fillStyle = 'rgba(168, 232, 255, 0.55)';
      ctx.beginPath();
      ctx.moveTo(-f.rx * 0.7, f.ry * 0.2);
      ctx.quadraticCurveTo(-f.rx * 1.8, f.ry * 0.2 + sway, -f.rx * 1.3, f.ry * 0.9);
      ctx.quadraticCurveTo(-f.rx * 0.95, f.ry * 0.55, -f.rx * 0.7, f.ry * 0.2);
      ctx.fill();
    } else if (id === 'cinder') {
      flameShape(-f.rx * 0.9, f.ry * 0.35, 18, '#ff6b35', '#ffd166');
    }
  }

  function drawWings(f, t) {
    if (state.form !== 'aurora' && state.form !== 'pearl') return;
    const flutter = Math.sin(t * 2.2) * 0.08;
    if (state.form === 'aurora') {
      ctx.fillStyle = 'rgba(195, 166, 255, 0.24)';
      for (const side of [-1, 1]) {
        ctx.save();
        ctx.scale(side, 1);
        ctx.rotate(flutter * side);
        ctx.beginPath();
        ctx.moveTo(f.rx * 0.55, -f.ry * 0.1);
        ctx.quadraticCurveTo(f.rx * 1.5, -f.ry * 0.9, f.rx * 1.35, f.ry * 0.25);
        ctx.quadraticCurveTo(f.rx * 1.0, f.ry * 0.5, f.rx * 0.55, -f.ry * 0.1);
        ctx.fill();
        ctx.restore();
      }
    } else {
      ctx.fillStyle = 'rgba(168, 232, 255, 0.28)';
      for (const side of [-1, 1]) {
        ctx.save();
        ctx.scale(side, 1);
        ctx.rotate(-0.2 - flutter);
        ctx.beginPath();
        ctx.moveTo(f.rx * 0.5, -f.ry * 0.15);
        ctx.quadraticCurveTo(f.rx * 1.45, -f.ry * 0.5, f.rx * 1.1, f.ry * 0.45);
        ctx.quadraticCurveTo(f.rx * 0.7, f.ry * 0.2, f.rx * 0.5, -f.ry * 0.15);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function drawBody(f) {
    const grd = ctx.createRadialGradient(-f.rx * 0.3, -f.ry * 0.4, 6, 0, 0, Math.max(f.rx, f.ry) * 1.25);
    grd.addColorStop(0, f.light);
    grd.addColorStop(0.55, f.hue);
    grd.addColorStop(1, f.dark);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(0, 0, f.rx, f.ry, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.beginPath();
    ctx.ellipse(-f.rx * 0.18, f.ry * 0.3, f.rx * 0.56, f.ry * 0.42, 0, 0, TAU);
    ctx.fill();
  }

  function drawLimbs(f) {
    // feet
    ctx.fillStyle = f.dark;
    ctx.beginPath();
    ctx.ellipse(-f.rx * 0.4, f.ry * 0.94, f.rx * 0.24, f.ry * 0.12, 0, 0, TAU);
    ctx.ellipse(f.rx * 0.4, f.ry * 0.94, f.rx * 0.24, f.ry * 0.12, 0, 0, TAU);
    ctx.fill();

    // arms
    const raised = state.react && state.react.type === 'train';
    const y = raised ? -f.ry * 0.25 : f.ry * 0.18;
    ctx.fillStyle = f.hue;
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(-f.rx * 0.94, y, f.rx * 0.18, f.ry * 0.16, raised ? -0.7 : 0.3, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(f.rx * 0.94, y, f.rx * 0.18, f.ry * 0.16, raised ? 0.7 : -0.3, 0, TAU);
    ctx.fill();
    ctx.stroke();

    if (state.form === 'tussle' || state.form === 'cinder') {
      ctx.fillStyle = f.light;
      ctx.beginPath();
      ctx.arc(-f.rx * 1.02, y + (raised ? -8 : 4), f.rx * 0.16, 0, TAU);
      ctx.arc(f.rx * 1.02, y + (raised ? -8 : 4), f.rx * 0.16, 0, TAU);
      ctx.fill();
    }
  }

  function drawEyes(f) {
    const happy = state.react && (state.react.type === 'clean' || state.react.type === 'feed');
    const blink = state.blink > 0;
    const eyeY = -f.ry * 0.18;
    const eyeX = f.rx * 0.32;
    const er = f.eye;

    if (blink || happy) {
      ctx.strokeStyle = '#26343a';
      ctx.lineWidth = Math.max(2, er * 0.2);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(-eyeX, eyeY + 2, er * 0.62, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(eyeX, eyeY + 2, er * 0.62, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
      return;
    }

    const lookX = state.pointer.active ? clamp((state.pointer.x - 240) / 220, -1, 1) * er * 0.18 : 0;
    const lookY = state.pointer.active ? clamp((state.pointer.y - 292) / 220, -1, 1) * er * 0.18 : 0;

    for (const side of [-1, 1]) {
      ctx.fillStyle = '#f9fffd';
      ctx.beginPath();
      ctx.ellipse(side * eyeX, eyeY, er * 0.72, er, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(20, 40, 38, 0.55)';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      ctx.fillStyle = '#17282b';
      ctx.beginPath();
      ctx.arc(side * eyeX + lookX, eyeY + lookY, er * 0.46, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(side * eyeX + lookX - er * 0.16, eyeY + lookY - er * 0.2, er * 0.15, 0, TAU);
      ctx.fill();
    }
  }

  function drawFace(f) {
    const eyeY = -f.ry * 0.18;
    const eyeX = f.rx * 0.32;
    const er = f.eye;

    drawEyes(f);

    if (state.form === 'cinder' || state.form === 'tussle') {
      ctx.strokeStyle = '#3a2028';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-eyeX - er * 0.5, eyeY - er * 1.25);
      ctx.lineTo(-eyeX + er * 0.45, eyeY - er * 0.8);
      ctx.moveTo(eyeX + er * 0.5, eyeY - er * 1.25);
      ctx.lineTo(eyeX - er * 0.45, eyeY - er * 0.8);
      ctx.stroke();
    }

    // cheeks
    ctx.fillStyle = 'rgba(255, 143, 163, 0.32)';
    ctx.beginPath();
    ctx.ellipse(-f.rx * 0.62, f.ry * 0.14, f.rx * 0.14, f.ry * 0.08, 0, 0, TAU);
    ctx.ellipse(f.rx * 0.62, f.ry * 0.14, f.rx * 0.14, f.ry * 0.08, 0, 0, TAU);
    ctx.fill();

    const mouthY = f.ry * 0.3;

    if (state.react && state.react.type === 'feed') {
      ctx.fillStyle = '#4a2526';
      ctx.beginPath();
      ctx.ellipse(0, mouthY, f.rx * 0.19, f.ry * 0.15, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#ff8fa3';
      ctx.beginPath();
      ctx.ellipse(0, mouthY + f.ry * 0.06, f.rx * 0.11, f.ry * 0.06, 0, 0, TAU);
      ctx.fill();
      return;
    }

    const sad = state.food < 25 || state.clean < 25;

    if (state.form === 'glutton') {
      ctx.fillStyle = '#4a2526';
      ctx.beginPath();
      ctx.ellipse(0, mouthY, f.rx * 0.34, f.ry * 0.2, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#ff8fa3';
      ctx.beginPath();
      ctx.ellipse(0, mouthY + f.ry * 0.08, f.rx * 0.2, f.ry * 0.08, 0, 0, TAU);
      ctx.fill();
      return;
    }

    if (sad) {
      ctx.strokeStyle = '#3a2a2c';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, mouthY + f.ry * 0.12, f.rx * 0.16, Math.PI * 1.2, Math.PI * 1.8);
      ctx.stroke();

      ctx.fillStyle = 'rgba(120, 210, 255, 0.8)';
      ctx.beginPath();
      ctx.ellipse(-f.rx * 0.62, f.ry * 0.28, 2.5, 4, 0, 0, TAU);
      ctx.fill();
      return;
    }

    if (state.form === 'cinder') {
      ctx.strokeStyle = '#3a2028';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-f.rx * 0.14, mouthY);
      ctx.quadraticCurveTo(0, mouthY + f.ry * 0.1, f.rx * 0.18, mouthY - f.ry * 0.02);
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(f.rx * 0.12, mouthY - 1);
      ctx.lineTo(f.rx * 0.19, mouthY + 5);
      ctx.lineTo(f.rx * 0.22, mouthY);
      ctx.fill();
      return;
    }

    ctx.strokeStyle = '#3a2a2c';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, mouthY - f.ry * 0.04, f.rx * 0.17, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
  }

  function drawCrest(f, t) {
    const id = state.form;

    if (id === 'baby') {
      ctx.strokeStyle = '#2f8f74';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-4, -f.ry * 0.98);
      ctx.quadraticCurveTo(-12, -f.ry * 1.3, -6, -f.ry * 1.42);
      ctx.moveTo(5, -f.ry * 0.98);
      ctx.quadraticCurveTo(13, -f.ry * 1.3, 7, -f.ry * 1.42);
      ctx.stroke();
      leafShape(-7, -f.ry * 1.38, -0.7, 12, 5, '#6fdcae');
      leafShape(8, -f.ry * 1.38, 2.4, 12, 5, '#6fdcae');
    } else if (id === 'sprout') {
      ctx.strokeStyle = '#2b8060';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -f.ry * 0.95);
      ctx.lineTo(0, -f.ry * 1.25);
      ctx.stroke();
      leafShape(0, -f.ry * 1.2, -0.9, 20, 8, '#7fe4b2');
      leafShape(0, -f.ry * 1.2, 0.5, 18, 7, '#a7f2cd');
      leafShape(0, -f.ry * 1.16, -2.4, 15, 6, '#5cc99a');
    } else if (id === 'puff' || id === 'glutton') {
      ctx.fillStyle = '#d98b3d';
      ctx.beginPath();
      ctx.ellipse(0, -f.ry * 0.95, f.rx * 0.95, f.ry * 0.4, 0, Math.PI, TAU);
      ctx.fill();
      ctx.fillStyle = '#f7b25c';
      ctx.beginPath();
      ctx.ellipse(0, -f.ry * 1.02, f.rx * 0.88, f.ry * 0.34, 0, Math.PI, TAU);
      ctx.fill();
      ctx.fillStyle = '#ffe3bd';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(-f.rx * 0.4 + i * f.rx * 0.4, -f.ry * 1.14 - (i % 2) * 4, f.rx * 0.09, 0, TAU);
        ctx.fill();
      }
    } else if (id === 'dew') {
      ctx.fillStyle = 'rgba(217, 249, 255, 0.85)';
      ctx.beginPath();
      ctx.arc(0, -f.ry * 1.18, f.rx * 0.2, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.beginPath();
      ctx.arc(-f.rx * 0.06, -f.ry * 1.24, 2.5, 0, TAU);
      ctx.fill();
      leafShape(0, -f.ry * 0.92, 1.2, 16, 5, '#4cb8d8');
    } else if (id === 'tussle') {
      ctx.fillStyle = '#c9a06a';
      ctx.beginPath();
      ctx.moveTo(-f.rx * 0.55, -f.ry * 0.9);
      ctx.lineTo(-f.rx * 0.75, -f.ry * 1.32);
      ctx.lineTo(-f.rx * 0.28, -f.ry * 1.02);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(f.rx * 0.55, -f.ry * 0.9);
      ctx.lineTo(f.rx * 0.75, -f.ry * 1.32);
      ctx.lineTo(f.rx * 0.28, -f.ry * 1.02);
      ctx.closePath();
      ctx.fill();
    } else if (id === 'aurora') {
      ctx.save();
      ctx.translate(0, -f.ry * 1.22);
      ctx.rotate(t * 0.3);
      starPath(0, 0, f.rx * 0.36, 4, 0.38);
      ctx.fillStyle = 'rgba(143, 255, 220, 0.85)';
      ctx.shadowColor = 'rgba(143, 255, 220, 0.8)';
      ctx.shadowBlur = 16;
      ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0;
    } else if (id === 'pearl') {
      const bob = Math.sin(t * 2) * 3;
      ctx.fillStyle = '#eafaff';
      ctx.beginPath();
      ctx.arc(0, -f.ry * 1.24 + bob, f.rx * 0.28, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.beginPath();
      ctx.arc(-f.rx * 0.08, -f.ry * 1.32 + bob, f.rx * 0.07, 0, TAU);
      ctx.fill();
    } else if (id === 'cinder') {
      starPath(0, -f.ry * 1.2, f.rx * 0.2, 5, 0.4);
      ctx.fillStyle = 'rgba(255, 209, 102, 0.9)';
      ctx.fill();
      flameShape(-f.rx * 0.5, -f.ry * 1.02, 16, '#ff6b35', '#ffd166');
      flameShape(f.rx * 0.5, -f.ry * 1.02, 16, '#ff6b35', '#ffd166');
    }
  }

  function drawDirt(f) {
    const grime = clamp((45 - state.clean) / 45, 0, 1);
    if (grime <= 0.02) return;
    ctx.globalAlpha = grime * 0.7;
    ctx.fillStyle = '#5b4632';
    for (let i = 0; i < dirtSpots.length; i++) {
      const s = dirtSpots[i];
      ctx.beginPath();
      ctx.arc(s.x * f.rx * 0.8, s.y * f.ry * 0.8, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawCreature(t) {
    const f = form();
    const jump = state.react && state.react.type === 'train'
      ? Math.max(0, Math.sin((1 - state.react.t / 0.9) * Math.PI)) * 14
      : 0;
    const bob = Math.sin(t * 2.1) * 3 - jump;
    const cx = 240;
    const cy = 292;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 96, 64 * f.scale, 13 * f.scale, 0, 0, TAU);
    ctx.fill();

    if (state.bond > 65) {
      ctx.save();
      ctx.globalAlpha = 0.25 + 0.1 * Math.sin(t * 2.4);
      starPath(cx, cy - 6, 92 * f.scale, 8, 0.8);
      ctx.fillStyle = 'rgba(143, 255, 220, 0.2)';
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(cx, cy + bob);
    ctx.scale(f.scale, f.scale);

    drawTail(f, t);
    drawWings(f, t);
    drawLimbs(f);
    drawBody(f);
    drawFace(f);
    drawCrest(f, t);
    drawDirt(f);

    ctx.restore();

    if (state.bond > 80 && state.mode !== 'evolving') {
      ctx.fillStyle = 'rgba(255, 209, 102, 0.9)';
      for (let i = 0; i < 3; i++) {
        const a = t * 1.4 + i * 2.1;
        const sx = cx + Math.cos(a) * 90;
        const sy = cy - 30 + Math.sin(a * 1.3) * 55;
        starPath(sx, sy, 2.5, 4, 0.4);
        ctx.fill();
      }
    }
  }

  /* ---------- bubbles and particles ---------- */
  function drawSpeech() {
    if (!state.bubble) return;
    const b = state.bubble;
    const alpha = clamp(b.t / 0.25, 0, 1);
    const cx = 240;
    const cy = 150;

    ctx.font = '700 12px ui-monospace, Menlo, monospace';
    const w = ctx.measureText(b.text).width + 30;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(8, 18, 17, 0.88)';
    ctx.strokeStyle = b.color ? b.color : 'rgba(143, 255, 220, 0.5)';
    ctx.lineWidth = 1.5;
    roundRect(cx - w / 2, cy - 18, w, 34, 12);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 6, cy + 15);
    ctx.lineTo(cx + 2, cy + 26);
    ctx.lineTo(cx + 9, cy + 15);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = b.color ? b.color : '#8fffdc';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.text, cx, cy);
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    for (const p of state.particles) {
      const alpha = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = alpha;
      if (p.shape === 'bubble') {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.stroke();
      } else if (p.shape === 'star') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot || 0);
        starPath(0, 0, p.size, 4, 0.4);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
      } else if (p.shape === 'heart') {
        ctx.fillStyle = p.color;
        heartPath(p.x, p.y, p.size * 1.8);
        ctx.fill();
      } else {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot || 0);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawFlash() {
    if (state.flash <= 0.01) return;
    const { x, y, r } = POD;
    const grd = ctx.createRadialGradient(x, y, 0, x, y, r * 1.3);
    grd.addColorStop(0, 'rgba(230, 255, 245, ' + (0.7 * state.flash) + ')');
    grd.addColorStop(1, 'rgba(143, 255, 220, 0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x, y, r * 1.3, 0, TAU);
    ctx.fill();
  }

  /* ---------- HUD ---------- */
  function drawHeart(x, y, size, color) {
    ctx.fillStyle = color;
    heartPath(x, y, size);
    ctx.fill();
  }

  function drawHud(t) {
    ctx.textBaseline = 'alphabetic';

    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(234, 255, 246, 0.4)';
    ctx.font = '700 9px ui-monospace, Menlo, monospace';
    ctx.fillText('CREATURE NURSERY', 22, 24);

    ctx.fillStyle = '#eafff6';
    ctx.font = '700 24px ui-monospace, Menlo, monospace';
    ctx.fillText(form().name, 22, 50);

    ctx.fillStyle = 'rgba(234, 255, 246, 0.4)';
    ctx.font = '700 9px ui-monospace, Menlo, monospace';
    ctx.fillText('STAGE ' + state.stage + ' · ' + STAGE_NAMES[state.stage], 22, 66);

    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(234, 255, 246, 0.4)';
    ctx.font = '700 9px ui-monospace, Menlo, monospace';
    ctx.fillText('EVOLUTION DEX', W - 22, 24);
    ctx.fillStyle = '#8fffdc';
    ctx.font = '700 18px ui-monospace, Menlo, monospace';
    ctx.fillText(state.dex.length + '/' + FINAL_FORMS.length, W - 22, 48);
    ctx.fillStyle = 'rgba(234, 255, 246, 0.35)';
    ctx.font = '700 9px ui-monospace, Menlo, monospace';
    ctx.fillText('GROWTH ' + Math.round(stageProgress() * 100) + '%', W - 22, 66);
  }

  function drawStatus() {
    const tag = careTag();
    ctx.textAlign = 'left';
    ctx.font = '700 9px ui-monospace, Menlo, monospace';
    ctx.fillStyle = 'rgba(234, 255, 246, 0.55)';
    ctx.fillText(moodText().toUpperCase(), 36, 448);

    ctx.textAlign = 'right';
    ctx.fillStyle = tag.color;
    ctx.fillText(tag.text, W - 36, 448);
  }

  function drawStatRow(label, value, color, y) {
    ctx.textAlign = 'left';
    ctx.font = '700 9px ui-monospace, Menlo, monospace';
    ctx.fillStyle = 'rgba(234, 255, 246, 0.55)';
    ctx.fillText(label, 36, y + 8);

    const bx = 112;
    const bw = 300;
    const bh = 9;
    roundRect(bx, y, bw, bh, bh / 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.fill();

    const frac = clamp(value / 100, 0, 1);
    if (frac > 0.005) {
      roundRect(bx, y, Math.max(bh, bw * frac), bh, bh / 2);
      const grd = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      grd.addColorStop(0, hexA(color, 0.45));
      grd.addColorStop(1, color);
      ctx.fillStyle = grd;
      ctx.fill();
    }

    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(234, 255, 246, 0.75)';
    ctx.font = '700 9px ui-monospace, Menlo, monospace';
    ctx.fillText(String(Math.round(value)), W - 36, y + 8);
  }

  function hexA(hex, a) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + a + ')';
  }

  function drawStats() {
    drawStatus();
    drawStatRow('FOOD', state.drawFood, '#ffc65c', 466);
    drawStatRow('CLEAN', state.drawClean, '#6fd8f5', 496);
    drawStatRow('TRAIN', state.drawTrain, '#c7a6ff', 526);

    ctx.textAlign = 'left';
    ctx.font = '700 9px ui-monospace, Menlo, monospace';
    ctx.fillStyle = 'rgba(234, 255, 246, 0.4)';
    ctx.fillText('BOND', 36, 578);

    const filled = Math.round(clamp(state.drawBond / 20, 0, 5));
    const size = 20;
    const gap = 6;
    const total = 5 * size + 4 * gap;
    const sx = W / 2 - total / 2;
    for (let i = 0; i < 5; i++) {
      drawHeart(sx + i * (size + gap) + size / 2, 573, size, i < filled ? '#ff8fa3' : 'rgba(255, 255, 255, 0.1)');
    }
  }

  /* ---------- render ---------- */
  function render() {
    const t = state.t;
    drawBackground(t);

    ctx.save();
    if (state.shake > 0.4) {
      ctx.translate(rand(-state.shake, state.shake) * 0.35, rand(-state.shake, state.shake) * 0.35);
    }
    drawPodBack(t);
    drawCreature(t);
    drawPodFront(t);
    drawSpeech();
    drawFlash();
    drawParticles();
    ctx.restore();

    drawHud(t);
    drawStats();
  }

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    state.pointer.x = ((e.clientX - rect.left) / rect.width) * W;
    state.pointer.y = ((e.clientY - rect.top) / rect.height) * H;
    state.pointer.active = true;
  });

  canvas.addEventListener('pointerleave', () => {
    state.pointer.active = false;
  });

  feedBtn.addEventListener('click', () => care('feed'));
  cleanBtn.addEventListener('click', () => care('clean'));
  trainBtn.addEventListener('click', () => care('train'));

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.key === '1') care('feed');
    else if (e.key === '2') care('clean');
    else if (e.key === '3') care('train');
    else if (e.key === 'Enter' || e.key === ' ') {
      if (!overlay.hidden) {
        e.preventDefault();
        startRun();
      }
    }
  });

  ovBtn.addEventListener('click', startRun);

  /* ---------- boot ---------- */
  startRun();
  syncButtons();
  let last = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
