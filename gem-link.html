<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>Gem Link</title>
<link rel="stylesheet" href="common.css">
<style>
  :root {
    --bg-top: #17233d;
    --bg-mid: #080b12;
    --bg-bottom: #05070b;
    --stage-bg: #0b1018;
    --ink: #e9f1ff;
    --stage-offset: 116px;
  }
  .controls { display: flex; gap: 8px; }
  .ghost {
    min-height: 40px;
    padding: 10px 22px;
    border: 1px solid rgba(233, 241, 255, 0.16);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.035);
    color: rgba(233, 241, 255, 0.78);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease, transform 100ms ease;
  }
  .ghost:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; border-color: rgba(233, 241, 255, 0.28); }
  .ghost:active { transform: translateY(1px); }
  .panel { max-width: 360px; }
  .title { margin-bottom: 18px; color: #c4a7ff; text-shadow: 0 0 26px rgba(179, 136, 255, 0.35); }
  .score {
    font-size: 54px;
    line-height: 1;
    font-weight: 700;
    color: #5ee7c7;
    text-shadow: 0 0 30px rgba(94, 231, 199, 0.35);
  }
  .best { margin-top: 10px; font-size: 13px; letter-spacing: 0.16em; }
  .btn { margin-top: 22px; padding: 15px 32px; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="640" aria-label="Gem Link puzzle board. Drag between matching gems and fill every tile."></canvas>
    <div id="overlay" class="overlay" hidden>
      <div class="panel">
        <p class="eyebrow">Gem Link</p>
        <h1 class="title">Solved</h1>
        <p class="label">Level</p>
        <p class="score" id="clearLevel">1</p>
        <p class="best" id="nextLine">Next: 6 &times; 6 &middot; 5 pairs</p>
        <button type="button" id="next" class="btn">Next puzzle</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <button type="button" id="undo" class="ghost" title="Undo (U)">Undo</button>
    <button type="button" id="reset" class="ghost" title="Reset puzzle (R)">Reset</button>
  </div>
  <p class="hint">drag between matching gems &middot; fill every tile &middot; U undo</p>

<script>
(() => {
  'use strict';

  const W = 480;
  const H = 640;
  const STORAGE_KEY = 'gemlink.level.v1';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const overlay = document.getElementById('overlay');
  const clearLevelEl = document.getElementById('clearLevel');
  const nextLineEl = document.getElementById('nextLine');
  const nextBtn = document.getElementById('next');
  const undoBtn = document.getElementById('undo');
  const resetBtn = document.getElementById('reset');

  const rand = (lo, hi) => lo + Math.random() * (hi - lo);
  const randInt = (n) => Math.floor(Math.random() * n);

  /* ---------- palette ---------- */
  const PALETTE = [
    { base: '#ff6b6b', light: '#ffc2c2', deep: '#a83030' },
    { base: '#4cc9f0', light: '#c4f0ff', deep: '#1f7090' },
    { base: '#5ee7c7', light: '#c8fff1', deep: '#228a72' },
    { base: '#ffd166', light: '#fff2c8', deep: '#a8802a' },
    { base: '#b388ff', light: '#e6d6ff', deep: '#6c48b8' },
    { base: '#ff9f68', light: '#ffdcc6', deep: '#b05e2e' },
    { base: '#f472b6', light: '#ffd1e8', deep: '#a83a78' },
    { base: '#a3e635', light: '#e6fbb0', deep: '#5e8f16' },
  ];

  function hexA(hex, a) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + a + ')';
  }

  /* ---------- levels ---------- */
  function levelConfig(level) {
    if (level <= 1) return { rows: 5, cols: 5, pairs: 4 };
    if (level <= 2) return { rows: 5, cols: 5, pairs: 5 };
    if (level <= 4) return { rows: 6, cols: 6, pairs: 5 };
    if (level <= 6) return { rows: 6, cols: 6, pairs: 6 };
    if (level <= 8) return { rows: 7, cols: 7, pairs: 6 };
    if (level <= 10) return { rows: 7, cols: 7, pairs: 7 };
    if (level <= 13) return { rows: 8, cols: 8, pairs: 7 };
    return { rows: 8, cols: 8, pairs: 8 };
  }

  function describeLevel(level) {
    const cfg = levelConfig(level);
    return cfg.rows + ' × ' + cfg.cols + ' · ' + cfg.pairs + ' pairs';
  }

  function readLevel() {
    try {
      const v = Number(window.localStorage.getItem(STORAGE_KEY));
      return Number.isFinite(v) && v >= 1 ? Math.floor(v) : 1;
    } catch (err) {
      return 1;
    }
  }

  function writeLevel(v) {
    try {
      window.localStorage.setItem(STORAGE_KEY, String(v));
    } catch (err) {
      /* storage may be unavailable (private mode, file://) */
    }
  }

  /* ---------- puzzle generation ---------- */
  function adjacent(a, b, cols) {
    const ar = Math.floor(a / cols);
    const ac = a % cols;
    const br = Math.floor(b / cols);
    const bc = b % cols;
    return Math.abs(ar - br) + Math.abs(ac - bc) === 1;
  }

  function gridNeighbors(rows, cols) {
    const list = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = r * cols + c;
        const out = [];
        if (r > 0) out.push(cell - cols);
        if (r < rows - 1) out.push(cell + cols);
        if (c > 0) out.push(cell - 1);
        if (c < cols - 1) out.push(cell + 1);
        list.push(out);
      }
    }
    return list;
  }

  /*
   * Grow disjoint paths that tile the whole board: start with every cell as its
   * own path, then repeatedly join two paths end-to-end. Whatever remains is a
   * guaranteed solution where every tile is used exactly once.
   */
  function generatePuzzle(rows, cols, pairCount) {
    const n = rows * cols;
    const nb = gridNeighbors(rows, cols);

    for (let attempt = 0; attempt < 100; attempt++) {
      const paths = [];
      for (let i = 0; i < n; i++) paths.push([i]);
      const owner = new Int32Array(n);
      for (let i = 0; i < n; i++) owner[i] = i;
      let active = n;
      let guard = 0;

      while (active > pairCount && guard++ < 2000) {
        const options = [];
        const weights = [];
        let total = 0;
        for (let p = 0; p < paths.length; p++) {
          const pp = paths[p];
          if (pp.length === 0) continue;
          const ends = pp.length === 1 ? [0] : [0, pp.length - 1];
          for (let k = 0; k < ends.length; k++) {
            const e = pp[ends[k]];
            const nbs = nb[e];
            for (let j = 0; j < nbs.length; j++) {
              const other = owner[nbs[j]];
              if (other === p) continue;
              const op = paths[other];
              if (op.length === 0) continue;
              let oi = -1;
              if (op[0] === nbs[j]) oi = 0;
              else if (op[op.length - 1] === nbs[j]) oi = op.length - 1;
              if (oi < 0) continue;
              const w = 1 / (pp.length + op.length);
              options.push([p, ends[k], other, oi]);
              weights.push(w);
              total += w;
            }
          }
        }
        if (options.length === 0) break;

        let roll = Math.random() * total;
        let pick = options[options.length - 1];
        for (let i = 0; i < options.length; i++) {
          roll -= weights[i];
          if (roll <= 0) { pick = options[i]; break; }
        }

        const pa = pick[0];
        const ea = pick[1];
        const qa = pick[2];
        const qia = pick[3];
        const A = paths[pa].slice();
        const B = paths[qa].slice();
        if (ea === 0) A.reverse();
        if (qia !== 0) B.reverse();
        const merged = A.concat(B);
        paths[pa] = merged;
        paths[qa] = [];
        for (let i = 0; i < merged.length; i++) owner[merged[i]] = pa;
        active--;
      }

      if (active !== pairCount) continue;
      const segs = paths.filter((p) => p.length > 0);
      if (segs.length !== pairCount) continue;
      let ok = true;
      for (let i = 0; i < segs.length; i++) {
        const s = segs[i];
        if (s.length < 3 || adjacent(s[0], s[s.length - 1], cols)) { ok = false; break; }
      }
      if (!ok) continue;
      return segs;
    }

    return serpentinePuzzle(rows, cols, pairCount);
  }

  /* Fallback that always tiles the board: one snake, split into pieces. */
  function serpentinePuzzle(rows, cols, pairCount) {
    let lastSegs = null;

    for (let attempt = 0; attempt < 80; attempt++) {
      const cells = [];
      const flipRows = Math.random() < 0.5;
      const vertical = Math.random() < 0.5;
      for (let i = 0; i < rows; i++) {
        const r = flipRows ? rows - 1 - i : i;
        const forward = i % 2 === 0;
        for (let j = 0; j < cols; j++) {
          const c = forward ? j : cols - 1 - j;
          cells.push(vertical ? c * cols + r : r * cols + c);
        }
      }

      const lens = [];
      let left = cells.length - pairCount * 3;
      for (let i = 0; i < pairCount; i++) lens.push(3);
      let i = 0;
      while (left > 0) {
        lens[i % pairCount]++;
        left--;
        i++;
      }

      const segs = [];
      let idx = 0;
      for (let k = 0; k < pairCount; k++) {
        segs.push(cells.slice(idx, idx + lens[k]));
        idx += lens[k];
      }
      lastSegs = segs;

      let ok = true;
      for (let k = 0; k < segs.length; k++) {
        const s = segs[k];
        if (adjacent(s[0], s[s.length - 1], cols)) { ok = false; break; }
      }
      if (ok) return segs;
    }

    return lastSegs;
  }

  /* ---------- canvas setup ---------- */
  let bgGradient = null;

  function sizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bgGradient = null;
  }

  /* ---------- state ---------- */
  const state = {
    mode: 'playing',
    level: 1,
    rows: 5,
    cols: 5,
    cellCount: 25,
    pairCount: 4,
    colorOffset: 0,
    gems: [],
    paths: [],
    gemAt: null,
    occ: null,
    drawing: -1,
    lastDragCell: -1,
    hoverCell: -1,
    history: [],
    particles: [],
    winTimer: 0,
    t: 0,
  };

  let cellSize = 44;
  let boardX = 0;
  let boardY = 0;
  let boardW = 0;
  let boardH = 0;

  const colorOf = (i) => PALETTE[(i + state.colorOffset) % PALETTE.length];

  const stars = [];
  for (let i = 0; i < 30; i++) {
    stars.push({ x: rand(0, W), y: rand(0, H), r: rand(0.5, 1.5), p: rand(0, Math.PI * 2) });
  }

  /* ---------- layout ---------- */
  function computeLayout() {
    const top = 100;
    const pad = 18;
    const bottom = 24;
    const availW = W - pad * 2;
    const availH = H - top - bottom;
    cellSize = Math.min(availW / state.cols, availH / state.rows);
    boardW = cellSize * state.cols;
    boardH = cellSize * state.rows;
    boardX = (W - boardW) / 2;
    boardY = top + (availH - boardH) / 2;
  }

  function cellCenter(cell) {
    const r = Math.floor(cell / state.cols);
    const c = cell % state.cols;
    return {
      x: boardX + (c + 0.5) * cellSize,
      y: boardY + (r + 0.5) * cellSize,
    };
  }

  function cellAt(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * W;
    const y = ((clientY - rect.top) / rect.height) * H;
    const c = Math.floor((x - boardX) / cellSize);
    const r = Math.floor((y - boardY) / cellSize);
    if (c < 0 || c >= state.cols || r < 0 || r >= state.rows) return -1;
    return r * state.cols + c;
  }

  /* ---------- board helpers ---------- */
  function rebuild() {
    state.occ.fill(-1);
    for (let i = 0; i < state.paths.length; i++) {
      const path = state.paths[i];
      for (let k = 0; k < path.length; k++) state.occ[path[k]] = i;
    }
    for (let c = 0; c < state.cellCount; c++) {
      if (state.gemAt[c] >= 0) state.occ[c] = state.gemAt[c];
    }
  }

  function isComplete(i) {
    const path = state.paths[i];
    if (path.length < 2) return false;
    const g = state.gems[i];
    return (path[0] === g[0] && path[path.length - 1] === g[1]) ||
      (path[0] === g[1] && path[path.length - 1] === g[0]);
  }

  function connectedCount() {
    let n = 0;
    for (let i = 0; i < state.paths.length; i++) if (isComplete(i)) n++;
    return n;
  }

  function filledCount() {
    let n = 0;
    for (let i = 0; i < state.cellCount; i++) if (state.occ[i] >= 0) n++;
    return n;
  }

  function pathsEqual(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) {
      if (a[i].length !== b[i].length) return false;
      for (let j = 0; j < a[i].length; j++) {
        if (a[i][j] !== b[i][j]) return false;
      }
    }
    return true;
  }

  function pushHistory() {
    state.history.push({ paths: state.paths.map((p) => p.slice()) });
    if (state.history.length > 60) state.history.shift();
  }

  /* ---------- level flow ---------- */
  function startLevel(level) {
    state.level = level;
    const cfg = levelConfig(level);
    state.rows = cfg.rows;
    state.cols = cfg.cols;
    state.cellCount = cfg.rows * cfg.cols;
    state.pairCount = cfg.pairs;
    state.colorOffset = (level * 3) % PALETTE.length;

    const segs = generatePuzzle(cfg.rows, cfg.cols, cfg.pairs);
    state.gems = [];
    state.paths = [];
    state.gemAt = new Int8Array(state.cellCount).fill(-1);
    state.occ = new Int8Array(state.cellCount).fill(-1);

    for (let i = 0; i < segs.length; i++) {
      const seg = segs[i];
      const a = seg[0];
      const b = seg[seg.length - 1];
      state.gems.push([a, b]);
      state.paths.push([a]);
      state.gemAt[a] = i;
      state.gemAt[b] = i;
    }

    rebuild();
    computeLayout();

    state.mode = 'playing';
    state.drawing = -1;
    state.lastDragCell = -1;
    state.hoverCell = -1;
    state.history.length = 0;
    state.particles.length = 0;
    state.winTimer = 0;
    state.t = 0;

    overlay.hidden = true;
    clearLevelEl.textContent = String(state.level);
    nextLineEl.textContent = 'Next: ' + describeLevel(state.level + 1);
  }

  function checkWin() {
    if (state.mode !== 'playing') return;
    if (connectedCount() !== state.pairCount) return;
    if (filledCount() !== state.cellCount) return;
    win();
  }

  function win() {
    state.mode = 'won';
    state.drawing = -1;
    state.hoverCell = -1;
    state.winTimer = 0.5;

    const next = state.level + 1;
    if (next > readLevel()) writeLevel(next);
    updateOverlayText();

    for (let i = 0; i < state.pairCount; i++) {
      const col = colorOf(i);
      const g = state.gems[i];
      for (let k = 0; k < 2; k++) {
        const p = cellCenter(g[k]);
        burst(p.x, p.y, col.base, 8, 180);
      }
    }
  }

  function updateOverlayText() {
    clearLevelEl.textContent = String(state.level);
    nextLineEl.textContent = 'Next: ' + describeLevel(state.level + 1);
  }

  function nextLevel() {
    if (state.mode !== 'won') return;
    startLevel(state.level + 1);
  }

  function undo() {
    if (state.mode !== 'playing' || state.history.length === 0) return;
    const snap = state.history.pop();
    state.paths = snap.paths.map((p) => p.slice());
    state.drawing = -1;
    state.lastDragCell = -1;
    rebuild();
  }

  function resetPuzzle() {
    if (state.mode !== 'playing') return;
    pushHistory();
    state.paths = state.gems.map((g) => [g[0]]);
    state.drawing = -1;
    state.lastDragCell = -1;
    rebuild();
  }

  /* ---------- drag logic ---------- */
  function extend(color, cell) {
    const path = state.paths[color];
    const last = path[path.length - 1];
    if (cell === last) return true;
    if (!adjacent(last, cell, state.cols)) return false;

    const own = path.indexOf(cell);
    if (own >= 0) {
      path.length = own + 1;
      rebuild();
      return true;
    }

    const gemOwner = state.gemAt[cell];
    if (gemOwner >= 0 && gemOwner !== color) return false;

    const other = state.occ[cell];
    if (other >= 0 && other !== color) {
      const op = state.paths[other];
      const idx = op.indexOf(cell);
      if (idx <= 0) return false;
      op.length = idx;
      rebuild();
    }

    path.push(cell);
    rebuild();

    if (isComplete(color)) {
      state.drawing = -1;
      const p = cellCenter(cell);
      burst(p.x, p.y, colorOf(color).base, 10, 200);
    }
    return true;
  }

  function dragTo(target) {
    let guard = 0;
    while (state.drawing >= 0 && state.lastDragCell !== target && guard++ < 128) {
      const last = state.lastDragCell;
      const lr = Math.floor(last / state.cols);
      const lc = last % state.cols;
      const tr = Math.floor(target / state.cols);
      const tc = target % state.cols;
      let nr = lr;
      let nc = lc;
      if (tr !== lr && (tc === lc || Math.abs(tr - lr) >= Math.abs(tc - lc))) {
        nr += tr > lr ? 1 : -1;
      } else {
        nc += tc > lc ? 1 : -1;
      }
      const step = nr * state.cols + nc;
      if (!extend(state.drawing, step)) break;
      state.lastDragCell = step;
    }
  }

  function endDrag() {
    state.drawing = -1;
    state.lastDragCell = -1;

    if (state.history.length > 0) {
      const snap = state.history[state.history.length - 1];
      if (pathsEqual(snap.paths, state.paths)) state.history.pop();
    }
    checkWin();
  }

  /* ---------- effects ---------- */
  function burst(x, y, color, count, power) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, Math.PI * 2);
      const sp = rand(power * 0.35, power);
      const life = rand(0.3, 0.7);
      state.particles.push({
        x,
        y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 60,
        life,
        max: life,
        size: rand(2, 4),
        color,
      });
    }
  }

  function updateParticles(dt) {
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        state.particles.splice(i, 1);
        continue;
      }
      p.vy += 520 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  /* ---------- update ---------- */
  function update(dt) {
    state.t += dt;
    updateParticles(dt);

    if (state.mode === 'won' && state.winTimer > 0) {
      state.winTimer -= dt;
      if (state.winTimer <= 0) {
        overlay.hidden = false;
        try {
          nextBtn.focus({ preventScroll: true });
        } catch (err) {
          nextBtn.focus();
        }
      }
    }
  }

  /* ---------- drawing ---------- */
  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function diamondPath(r) {
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.lineTo(r * 0.72, -r * 0.22);
    ctx.lineTo(0, r);
    ctx.lineTo(-r * 0.72, -r * 0.22);
    ctx.closePath();
  }

  function drawBackground(t) {
    if (!bgGradient) {
      bgGradient = ctx.createLinearGradient(0, 0, 0, H);
      bgGradient.addColorStop(0, '#121a2c');
      bgGradient.addColorStop(0.55, '#0a101c');
      bgGradient.addColorStop(1, '#06080e');
    }
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      ctx.globalAlpha = 0.1 + 0.16 * (0.5 + 0.5 * Math.sin(t * 1.2 + s.p));
      ctx.fillStyle = '#dff7ff';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    const vg = ctx.createRadialGradient(W / 2, H * 0.42, 100, W / 2, H * 0.42, 440);
    vg.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vg.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function drawBoard(t) {
    ctx.save();
    roundRect(boardX - 10, boardY - 10, boardW + 20, boardH + 20, 20);
    ctx.fillStyle = 'rgba(8, 13, 22, 0.72)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    const nudge = connectedCount() === state.pairCount && filledCount() < state.cellCount;

    for (let cell = 0; cell < state.cellCount; cell++) {
      const r = Math.floor(cell / state.cols);
      const c = cell % state.cols;
      const x = boardX + c * cellSize;
      const y = boardY + r * cellSize;
      const inset = cellSize * 0.045;

      roundRect(x + inset, y + inset, cellSize - inset * 2, cellSize - inset * 2, cellSize * 0.18);
      ctx.fillStyle = (r + c) % 2 === 0
        ? 'rgba(255, 255, 255, 0.032)'
        : 'rgba(255, 255, 255, 0.018)';
      ctx.fill();

      if (state.occ[cell] < 0) {
        const pulse = nudge
          ? 0.2 + 0.18 * (0.5 + 0.5 * Math.sin(t * 4 + (r + c) * 0.8))
          : 0.1;
        ctx.fillStyle = 'rgba(94, 231, 199, ' + pulse.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(x + cellSize / 2, y + cellSize / 2, nudge ? cellSize * 0.07 : cellSize * 0.035, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawPaths() {
    for (let i = 0; i < state.paths.length; i++) {
      const path = state.paths[i];
      if (path.length < 2) continue;
      const col = colorOf(i);
      const done = isComplete(i);

      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      const first = cellCenter(path[0]);
      ctx.moveTo(first.x, first.y);
      for (let k = 1; k < path.length; k++) {
        const p = cellCenter(path[k]);
        ctx.lineTo(p.x, p.y);
      }

      ctx.strokeStyle = hexA(col.base, done ? 0.24 : 0.15);
      ctx.lineWidth = cellSize * (done ? 0.74 : 0.66);
      ctx.stroke();

      if (done) {
        ctx.shadowColor = hexA(col.base, 0.55);
        ctx.shadowBlur = cellSize * 0.55;
      }
      ctx.strokeStyle = col.base;
      ctx.lineWidth = cellSize * 0.38;
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = hexA(col.light, 0.55);
      ctx.lineWidth = cellSize * 0.12;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawGem(cx, cy, r, col, done, t, phase) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 2.4 + phase);

    if (done) {
      const halo = ctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r * 2.6);
      halo.addColorStop(0, hexA(col.base, 0.28 + pulse * 0.1));
      halo.addColorStop(1, hexA(col.base, 0));
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 2.6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(cx, cy);

    diamondPath(r * 1.08);
    ctx.fillStyle = 'rgba(3, 6, 11, 0.55)';
    ctx.fill();

    const grd = ctx.createLinearGradient(-r, -r, r, r);
    grd.addColorStop(0, col.light);
    grd.addColorStop(0.42, col.base);
    grd.addColorStop(1, col.deep);
    diamondPath(r);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.strokeStyle = hexA('#ffffff', done ? 0.68 : 0.35);
    ctx.lineWidth = Math.max(1, r * 0.08);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, -r * 0.94);
    ctx.lineTo(-r * 0.6, -r * 0.24);
    ctx.lineTo(0, -r * 0.06);
    ctx.lineTo(r * 0.6, -r * 0.24);
    ctx.closePath();
    ctx.fillStyle = hexA('#ffffff', 0.22);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-r * 0.6, -r * 0.24);
    ctx.lineTo(0, -r * 0.06);
    ctx.lineTo(0, r * 0.9);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.beginPath();
    ctx.arc(-r * 0.28, -r * 0.42, Math.max(1.1, r * 0.11), 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawGems(t) {
    const hovered = state.drawing < 0 ? state.hoverCell : -1;

    for (let i = 0; i < state.gems.length; i++) {
      const col = colorOf(i);
      const done = isComplete(i);
      const g = state.gems[i];
      for (let k = 0; k < 2; k++) {
        const p = cellCenter(g[k]);
        const r = cellSize * 0.29;
        drawGem(p.x, p.y, r, col, done, t, i * 1.7 + k * 2.1);

        if (g[k] === hovered) {
          ctx.strokeStyle = hexA(col.light, 0.6);
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r * 1.55, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    if (state.drawing >= 0) {
      const path = state.paths[state.drawing];
      if (path.length > 0) {
        const p = cellCenter(path[path.length - 1]);
        ctx.strokeStyle = hexA(colorOf(state.drawing).light, 0.75);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, cellSize * 0.3, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function drawEffects() {
    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawHud() {
    const scrim = ctx.createLinearGradient(0, 0, 0, 104);
    scrim.addColorStop(0, 'rgba(6, 9, 15, 0.78)');
    scrim.addColorStop(1, 'rgba(6, 9, 15, 0)');
    ctx.fillStyle = scrim;
    ctx.fillRect(0, 0, W, 104);

    ctx.textBaseline = 'alphabetic';

    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(233, 241, 255, 0.45)';
    ctx.font = '700 10px ui-monospace, Menlo, monospace';
    ctx.fillText('LEVEL', 20, 26);
    ctx.fillStyle = '#e9f1ff';
    ctx.font = '700 28px ui-monospace, Menlo, monospace';
    ctx.fillText(String(state.level).padStart(2, '0'), 20, 56);

    const connected = connectedCount();
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(233, 241, 255, 0.45)';
    ctx.font = '700 10px ui-monospace, Menlo, monospace';
    ctx.fillText('PAIRS', W - 20, 26);
    ctx.fillStyle = connected === state.pairCount ? '#5ee7c7' : '#e9f1ff';
    ctx.font = '700 28px ui-monospace, Menlo, monospace';
    ctx.fillText(connected + '/' + state.pairCount, W - 20, 56);

    const bw = 132;
    const bx = (W - bw) / 2;
    const by = 78;
    const bh = 4;
    const filled = filledCount() / state.cellCount;

    roundRect(bx, by, bw, bh, bh / 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.fill();

    if (filled > 0) {
      roundRect(bx, by, Math.max(bh, bw * filled), bh, bh / 2);
      const grd = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      grd.addColorStop(0, '#4cc9f0');
      grd.addColorStop(1, '#5ee7c7');
      ctx.fillStyle = grd;
      ctx.fill();
    }
  }

  function render() {
    const t = state.t;
    drawBackground(t);
    drawBoard(t);
    drawPaths();
    drawGems(t);
    drawEffects();
    drawHud();
  }

  /* ---------- input: pointer ---------- */
  canvas.addEventListener('pointerdown', (e) => {
    if (state.mode !== 'playing') return;
    const cell = cellAt(e.clientX, e.clientY);
    if (cell < 0) return;

    const gem = state.gemAt[cell];
    let color = -1;
    if (gem >= 0) {
      color = gem;
    } else {
      const owner = state.occ[cell];
      if (owner < 0) return;
      color = owner;
    }

    pushHistory();

    if (gem >= 0) {
      state.paths[color] = [cell];
    } else {
      const path = state.paths[color];
      const idx = path.indexOf(cell);
      if (idx > 0) path.length = idx + 1;
      else if (idx === 0) state.paths[color] = [cell];
    }

    rebuild();
    state.drawing = color;
    state.lastDragCell = cell;

    try {
      canvas.setPointerCapture(e.pointerId);
    } catch (err) {
      /* ignore */
    }
    if (e.cancelable) e.preventDefault();
  });

  canvas.addEventListener('pointermove', (e) => {
    if (state.mode !== 'playing') return;
    const cell = cellAt(e.clientX, e.clientY);

    if (state.drawing >= 0) {
      if (cell < 0) return;
      dragTo(cell);
      if (e.cancelable) e.preventDefault();
    } else {
      state.hoverCell = cell;
    }
  });

  canvas.addEventListener('pointerleave', () => {
    if (state.drawing < 0) state.hoverCell = -1;
  });

  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  /* ---------- input: keyboard ---------- */
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'r' || k === 'R') {
      if (state.mode === 'playing') {
        e.preventDefault();
        resetPuzzle();
      }
    } else if (k === 'u' || k === 'U' || ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z'))) {
      if (state.mode === 'playing') {
        e.preventDefault();
        undo();
      }
    } else if (k === 'Enter' || k === ' ') {
      if (state.mode === 'won' && !overlay.hidden) {
        e.preventDefault();
        nextLevel();
      }
    }
  });

  window.addEventListener('blur', () => {
    state.drawing = -1;
    state.hoverCell = -1;
  });

  /* ---------- buttons ---------- */
  nextBtn.addEventListener('click', nextLevel);

  undoBtn.addEventListener('click', () => {
    undo();
    canvas.focus({ preventScroll: true });
  });

  resetBtn.addEventListener('click', () => {
    resetPuzzle();
    canvas.focus({ preventScroll: true });
  });

  /* ---------- loop ---------- */
  sizeCanvas();
  state.level = readLevel();
  startLevel(state.level);

  window.addEventListener('resize', () => {
    sizeCanvas();
    computeLayout();
  });

  let last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
